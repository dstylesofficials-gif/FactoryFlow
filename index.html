  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-black">

      // Seed Data matching screenshots
      const initialRoznamcha = [
        { id: 'ROZ-101', date: '2026-07-25', party: 'Haji Aslam Grain Supplier', description: 'Chana Pulse Advance Payment', type: 'Cash Paid', amount: 150000, voucher: 'V-8801' },
        { id: 'ROZ-102', date: '2026-07-25', party: 'Faisalabad Traders', description: 'Daal Moong Sale Receipt', type: 'Cash Received', amount: 280000, voucher: 'V-8802' },
      ];

      const initialWorkers = [
        { id: '1', name: 'Muhammad Ramzan (محمد رمضان)', category: 'دھلائی', phone: '0300-1234567', city: 'فیصل آباد', dailyWage: 2500, attendance: 'Present' },
        { id: '2', name: 'Tariq Mehmood (طارق محمود)', category: 'دلائی', phone: '0313-7654321', city: 'فیصل آباد', dailyWage: 2200, attendance: 'Present' },
        { id: '3', name: 'Allah Ditta (اللہ دتہ)', category: 'رکشہ والا', phone: '0321-9988776', city: 'فیصل آباد', dailyWage: 1800, attendance: 'Present' },
      ];

      const initialPurchases = [
        { id: '1', party: 'Haji Aslam Grain Co', product: 'ماش سالم ایس کیو - خام', quantityKg: 25000, totalAmount: 3400000, date: '2026-07-25' },
      ];

      const initialSales = [
        { id: '1', invoice: 'INV-901', party: 'Faisalabad Wholesale Traders', product: 'دال ماش ایس کیو', bags: 250, totalAmount: 2050000, date: '2026-07-25' },
      ];

      const initialParties = [
        { id: '1', name: 'Haji Aslam Grain Supplier', phone: '0300-6543210', city: 'Sargodha', type: 'Party', balance: 450000 },
      ];

      const initialBrokers = [
        { id: '1', name: 'سوڑی کھاتہ (Sori Khata)', code: 'مستقل کھاتہ', rate: 'Current Rate: 0', type: 'Broker' },
      ];

      const initialProducts = [
        { id: '#1', urduName: 'ماش سالم ایس کیو-خام', unit: '50Kg' },
        { id: '#2', urduName: 'ماش سالم ایف کیو-خام', unit: '50Kg' },
        { id: '#3', urduName: 'ماش سالم ژوب-خام', unit: '50Kg' },
        { id: '#4', urduName: 'ماش سالم لورالائی-خام', unit: '50Kg' },
        { id: '#5', urduName: 'ماش سالم چمن-خام', unit: '50Kg' },
        { id: '#6', urduName: 'دال ماش ایس کیو', unit: '25Kg' },
        { id: '#7', urduName: 'دال چنا اسپیشل (A-Grade)', unit: '50Kg' },
        { id: '#8', urduName: 'دال مونگ پالش', unit: '50Kg' },
      ];

      const initialGatePasses = [
        { id: 'GP-4001', truckNo: 'FSD-7892', driver: 'Rashid Khan', type: 'Outward Sale', goods: '250 Bags Daal Chana', netWeight: '12,500 KG', time: '04:30 PM', status: 'Passed' },
      ];

      const App = () => {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [searchQuery, setSearchQuery] = useState('');
        const [workerFilter, setWorkerFilter] = useState('سب'); // 'سب', 'دھلائی', 'دلائی', 'رکشہ والا'
        const [partyTab, setPartyTab] = useState('parties'); // 'parties' or 'brokers'

        // State collections
        const [roznamchaList, setRoznamchaList] = useState(initialRoznamcha);
        const [workersList, setWorkersList] = useState(initialWorkers);
        const [purchasesList, setPurchasesList] = useState(initialPurchases);
        const [salesList, setSalesList] = useState(initialSales);
        const [partiesList, setPartiesList] = useState(initialParties);
        const [brokersList, setBrokersList] = useState(initialBrokers);
        const [productsList, setProductsList] = useState(initialProducts);
        const [gatePassesList, setGatePassesList] = useState(initialGatePasses);

        // Modal Controls
        const [activeModal, setActiveModal] = useState(null);

        // Forms
        const [formRoznamcha, setFormRoznamcha] = useState({ party: '', description: '', type: 'Cash Received', amount: '', voucher: '' });
        const [formWorker, setFormWorker] = useState({ name: '', category: 'دھلائی', phone: '', city: 'فیصل آباد', dailyWage: '' });
        const [formPurchase, setFormPurchase] = useState({ party: '', product: 'ماش سالم ایس کیو-خام', quantityKg: '', totalAmount: '' });
        const [formSale, setFormSale] = useState({ party: '', product: 'دال ماش ایس کیو', bags: '', totalAmount: '' });
        const [formParty, setFormParty] = useState({ name: '', phone: '', city: 'فیصل آباد', type: 'Party' });
        const [formProduct, setFormProduct] = useState({ urduName: '', unit: '50Kg' });
        const [formGatePass, setFormGatePass] = useState({ truckNo: '', driver: '', goods: '', netWeight: '' });

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [activeTab, workerFilter, partyTab, activeModal, roznamchaList, workersList, purchasesList, salesList, productsList]);

        // Handlers
        const handleAddRoznamcha = (e) => {
          e.preventDefault();
          const entry = {
            id: `ROZ-${Date.now().toString().slice(-4)}`,
            date: '2026-07-25',
            party: formRoznamcha.party,
            description: formRoznamcha.description,
            type: formRoznamcha.type,
            amount: parseFloat(formRoznamcha.amount) || 0,
            voucher: formRoznamcha.voucher || `V-${Math.floor(1000 + Math.random() * 9000)}`,
          };
          setRoznamchaList([entry, ...roznamchaList]);
          setActiveModal(null);
          setFormRoznamcha({ party: '', description: '', type: 'Cash Received', amount: '', voucher: '' });
        };

        const handleAddWorker = (e) => {
          e.preventDefault();
          const w = {
            id: (workersList.length + 1).toString(),
            name: formWorker.name,
            category: formWorker.category,
            phone: formWorker.phone || '0300-0000000',
            city: formWorker.city,
            dailyWage: parseFloat(formWorker.dailyWage) || 2000,
            attendance: 'Present',
          };
          setWorkersList([...workersList, w]);
          setActiveModal(null);
          setFormWorker({ name: '', category: 'دھلائی', phone: '', city: 'فیصل آباد', dailyWage: '' });
        };

        const handleAddPurchase = (e) => {
          e.preventDefault();
          const p = {
            id: (purchasesList.length + 1).toString(),
            party: formPurchase.party,
            product: formPurchase.product,
            quantityKg: parseFloat(formPurchase.quantityKg) || 0,
            totalAmount: parseFloat(formPurchase.totalAmount) || 0,
            date: '2026-07-25',
          };
          setPurchasesList([p, ...purchasesList]);
          setActiveModal(null);
          setFormPurchase({ party: '', product: 'ماش سالم ایس کیو-خام', quantityKg: '', totalAmount: '' });
        };

        const handleAddSale = (e) => {
          e.preventDefault();
          const s = {
            id: (salesList.length + 1).toString(),
            invoice: `INV-${Math.floor(100 + Math.random() * 900)}`,
            party: formSale.party,
            product: formSale.product,
            bags: parseFloat(formSale.bags) || 0,
            totalAmount: parseFloat(formSale.totalAmount) || 0,
            date: '2026-07-25',
          };
          setSalesList([s, ...salesList]);
          setActiveModal(null);
          setFormSale({ party: '', product: 'دال ماش ایس کیو', bags: '', totalAmount: '' });
        };

        const handleAddParty = (e) => {
          e.preventDefault();
          const prt = {
            id: (partiesList.length + 1).toString(),
            name: formParty.name,
            phone: formParty.phone || '0300-1122334',
            city: formParty.city,
            type: formParty.type,
            balance: 0,
          };
          if (formParty.type === 'Broker') {
            setBrokersList([...brokersList, { id: prt.id, name: prt.name, code: 'بروکر کھاتہ', rate: 'Current Rate: 0', type: 'Broker' }]);
          } else {
            setPartiesList([...partiesList, prt]);
          }
          setActiveModal(null);
          setFormParty({ name: '', phone: '', city: 'فیصل آباد', type: 'Party' });
        };

        const handleAddProduct = (e) => {
          e.preventDefault();
          const prd = {
            id: `#${productsList.length + 1}`,
            urduName: formProduct.urduName,
            unit: formProduct.unit,
          };
          setProductsList([...productsList, prd]);
          setActiveModal(null);
          setFormProduct({ urduName: '', unit: '50Kg' });
        };

        const handleDeleteProduct = (id) => {
          setProductsList(productsList.filter(p => p.id !== id));
        };

        // Calculations
        const totalCashReceived = roznamchaList.filter(r => r.type === 'Cash Received').reduce((acc, r) => acc + r.amount, 0);
        const totalCashPaid = roznamchaList.filter(r => r.type === 'Cash Paid').reduce((acc, r) => acc + r.amount, 0);
        const openingRokar = 500000;
        const currentRokar = openingRokar + totalCashReceived - totalCashPaid;

        const dhulaiCount = workersList.filter(w => w.category === 'دھلائی').length;
        const dalaiCount = workersList.filter(w => w.category === 'دلائی').length;
        const presentCount = workersList.filter(w => w.attendance === 'Present').length;

        const totalPurchaseQty = purchasesList.reduce((acc, p) => acc + p.quantityKg, 0);
        const totalPurchaseAmount = purchasesList.reduce((acc, p) => acc + p.totalAmount, 0);

        const totalSalesAmount = salesList.reduce((acc, s) => acc + s.totalAmount, 0);

        const navItems = [
          { id: 'dashboard', labelEn: 'Dashboard', labelUr: 'خلاصہ', icon: 'layout-dashboard' },
          { id: 'daybook', labelEn: 'Day-Book', labelUr: 'روزنامچہ', icon: 'book-open' },
          { id: 'workers', labelEn: 'Workers', labelUr: 'کارکنان', icon: 'users' },
          { id: 'purchase', labelEn: 'Purchase', labelUr: 'خرید', icon: 'shopping-cart' },
          { id: 'sale', labelEn: 'Sale', labelUr: 'فروخت', icon: 'trending-up' },
          { id: 'parties', labelEn: 'Parties', labelUr: 'پارٹیز', icon: 'user-check' },
          { id: 'products', labelEn: 'Products', labelUr: 'اشیاء', icon: 'package' },
          { id: 'stock', labelEn: 'Stock', labelUr: 'مال / کھاتہ', icon: 'boxes' },
          { id: 'gatepass', labelEn: 'Gate Pass', labelUr: 'گیٹ پاس', icon: 'ticket' },
          { id: 'reports', labelEn: 'Reports', labelUr: 'رپورٹس', icon: 'bar-chart-3' },
        ];

        return (
          <div className="flex min-h-screen bg-dark-950 text-slate-100 font-sans">
            {/* Left Sidebar */}
            <aside className="w-64 bg-dark-900 border-r border-dark-800 flex flex-col h-screen sticky top-0 z-30">
              <div className="p-4 border-b border-dark-800 flex items-center justify-between bg-dark-950/50">
                <div className="flex items-center gap-3">
                  <div className="p-2.5 bg-brand-500 rounded-xl text-black font-bold shadow-lg shadow-brand-500/20">
                    <i data-lucide="factory" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <h1 className="font-display font-bold text-sm text-brand-500 tracking-tight leading-tight">Muhammad Daal Factory</h1>
                    <p className="text-[11px] text-slate-400 font-medium">Chohla, Faisalabad</p>
                  </div>
                </div>
                <i data-lucide="chevron-left" className="w-4 h-4 text-slate-500 cursor-pointer"></i>
              </div>

              <nav className="flex-1 overflow-y-auto p-3 space-y-1">
                {navItems.map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                        isActive
                          ? 'bg-brand-500 text-black shadow-lg shadow-brand-500/25 font-bold'
                          : 'text-slate-300 hover:text-white hover:bg-dark-800/80'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <i data-lucide={item.icon} className={`w-4 h-4 ${isActive ? 'text-black' : 'text-slate-400'}`}></i>
                        <span>{item.labelEn}</span>
                      </div>
                      <span className={`font-nastaliq text-xs ${isActive ? 'text-black font-bold' : 'text-amber-400/90'}`}>{item.labelUr}</span>
                    </button>
                  );
                })}

              <div className="p-4 border-t border-dark-800 bg-dark-950/60 flex items-center justify-between">

                    A
                  </div>
                  <div>
                    <p className="text-xs font-bold text-slate-100">Abdullah Dilbar</p>
                    <p className="text-[10px] text-slate-400">Proprietor</p>
                  </div>
                </div>
                <i data-lucide="chevron-down" className="w-4 h-4 text-slate-500"></i>
              </div>
            </aside>

            {/* Main Workspace */}

              {/* Header Bar */}
              <header className="h-16 bg-dark-900/90 backdrop-blur border-b border-dark-800 px-6 flex items-center justify-between sticky top-0 z-20">

                    <span>25-Jul-2026 • 17:50</span>
                  </div>

                  <a href="tel:03000676293" className="flex items-center gap-2 px-3 py-1 bg-dark-950 border border-dark-800 text-brand-500 rounded-lg text-xs font-bold">
                    <i data-lucide="phone" className="w-3.5 h-3.5"></i>
                    <span>0300-0676293</span>
                  </a>

                  <div className="flex items-center gap-2 px-3 py-1 bg-dark-800 rounded-lg border border-dark-700 text-xs">
                    <span className="w-2 h-2 rounded-full bg-brand-500"></span>
                    <span className="font-bold text-slate-200">Administrator</span>

                </div>

              {/* Main Content Pages */}
              <main className="flex-1 p-6 overflow-y-auto">
                {/* 1. DASHBOARD */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="flex items-center justify-between">
                      <h1 className="text-3xl font-bold text-slate-100 font-nastaliq">خلاصہ</h1>
                      <button onClick={() => setActiveModal('roznamcha')} className="bg-brand-500 hover:bg-brand-600 text-black text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg shadow-brand-500/20">
                        <i data-lucide="plus" className="w-4 h-4"></i>
                        <span>+ نئی اندراج</span>
                      </button>
                    </div>

                    <div className="bg-gradient-to-r from-brand-900/40 via-dark-900 to-dark-900 border border-brand-500/40 rounded-2xl p-6 glow-card">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-4">
                          <div className="p-4 bg-brand-500/20 text-brand-500 rounded-2xl border border-brand-500/30">
                            <i data-lucide="wallet" className="w-8 h-8"></i>
                          </div>
                          <div>
                            <h2 className="text-2xl font-bold text-brand-500 font-nastaliq">موجودہ روکڑ</h2>
                            <p className="text-xs text-slate-400 mt-0.5">Current Cash Balance — Roznamcha</p>
                          </div>
                        </div>
                        <div className="text-right">
                          <span className="text-4xl font-bold font-display text-brand-500 tracking-tight">PKR {currentRokar.toLocaleString()}</span>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-5">
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800">
                          <span className="text-xs font-bold text-slate-300">Receivable</span>
                          <span className="text-sm font-bold text-sky-400 font-nastaliq">وصولی</span>
                        </div>
                        <div className="mt-4 space-y-2 text-xs text-slate-400">
                          <div className="flex justify-between"><span>Overdue Bills</span><span className="font-bold text-white font-mono">0</span></div>
                          <div className="flex justify-between"><span>Total Overdue Amount</span><span className="font-bold text-white font-mono">0</span></div>
                          <div className="pt-2 border-t border-dark-800 flex justify-between font-bold text-slate-200">
                            <span>Net Receivable</span>
                            <span className="font-mono text-sky-400">0</span>
                          </div>
                          <p className="mt-3 text-center text-slate-500 font-nastaliq">کوئی واجب الادا بل نہیں</p>
                        </div>
                      </div>

                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-5">
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800">
                          <span className="text-xs font-bold text-slate-300">Payable</span>
                          <span className="text-sm font-bold text-amber-400 font-nastaliq">ادائیگی</span>
                        </div>
                        <div className="mt-4 space-y-2 text-xs text-slate-400">
                          <div className="flex justify-between"><span>Overdue Bills</span><span className="font-bold text-white font-mono">0</span></div>
                          <div className="flex justify-between"><span>Total Overdue Amount</span><span className="font-bold text-white font-mono">0</span></div>
                          <div className="pt-2 border-t border-dark-800 flex justify-between font-bold text-slate-200">
                            <span>Net Payable</span>
                            <span className="font-mono text-amber-400">0</span>
                          </div>
                          <p className="mt-3 text-center text-slate-500 font-nastaliq">کوئی واجب الادا بل نہیں</p>
                        </div>
                      </div>

                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-5">
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800">
                          <span className="text-xs font-bold text-slate-300">Stock</span>
                          <span className="text-sm font-bold text-emerald-400 font-nastaliq">اسٹاک</span>
                        </div>
                        <div className="mt-4 space-y-2 text-xs text-slate-400">
                          <div className="flex justify-between"><span>Total Purchases In</span><span className="font-bold text-white font-mono">0</span></div>
                          <div className="flex justify-between"><span>Total Sales Out</span><span className="font-bold text-white font-mono">-0</span></div>
                          <div className="pt-2 border-t border-dark-800 flex justify-between font-bold text-slate-200">
                            <span>Stock Balance</span>
                            <span className="font-mono text-emerald-400">0</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. DAY-BOOK (روزنامچہ) */}
                {activeTab === 'daybook' && (
                  <div className="space-y-6">
                    <div className="flex items-center justify-between">
                      <h1 className="text-3xl font-bold text-slate-100 font-nastaliq">روزنامچہ</h1>
                      <button onClick={() => setActiveModal('roznamcha')} className="bg-brand-500 hover:bg-brand-600 text-black text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg shadow-brand-500/20">
                        <i data-lucide="plus" className="w-4 h-4"></i>
                        <span>+ نئی اندراج</span>
                      </button>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-4">
                        <span className="text-sm font-bold text-slate-300 block font-nastaliq">ابتدائی روکڑ</span>
                        <p className="text-[11px] text-slate-500">Opening Rokar</p>
                        <h4 className="text-lg font-bold font-display text-sky-400 mt-2">{openingRokar}</h4>
                      </div>
                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-4">
                        <span className="text-sm font-bold text-slate-300 block font-nastaliq">جمع کیش</span>
                        <p className="text-[11px] text-slate-500">Cash Received</p>
                        <h4 className="text-lg font-bold font-display text-emerald-400 mt-2">{totalCashReceived}</h4>
                      </div>
                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-4">

                                      <i data-lucide="edit-3" className="w-4 h-4"></i>
                                    </button>
                                    <button onClick={() => handleDeleteProduct(prd.id)} className="p-1.5 text-slate-400 hover:text-rose-400">
                                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>
            </div>

            {/* MODAL WINDOWS */}
            {activeModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-dark-900 border border-dark-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl relative">
                  <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>

                  {/* Worker Modal */}
                  {activeModal === 'worker' && (
                    <form onSubmit={handleAddWorker} className="space-y-4 font-nastaliq">
                      <h3 className="text-xl font-bold text-brand-500">نیا ورکر شامل کریں</h3>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">ورکر کا نام (Worker Name)</label>
                        <input type="text" required value={formWorker.name} onChange={(e) => setFormWorker({ ...formWorker, name: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="محمد رمضان" />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">ورکر کی قسم (Category)</label>
                        <select value={formWorker.category} onChange={(e) => setFormWorker({ ...formWorker, category: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none font-nastaliq">
                          <option value="دھلائی">دھلائی</option>
                          <option value="دلائی">دلائی</option>
                          <option value="رکشہ والا">رکشہ والا</option>
                        </select>
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs font-nastaliq">ورکر محفوظ کریں</button>
                    </form>
                  )}

                  {/* Product Modal */}
                  {activeModal === 'product' && (
                    <form onSubmit={handleAddProduct} className="space-y-4">
                      <h3 className="text-xl font-bold font-nastaliq text-brand-500">Add New Product</h3>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1 font-nastaliq">اردو نام (Product Urdu Name)</label>
                        <input type="text" required value={formProduct.urduName} onChange={(e) => setFormProduct({ ...formProduct, urduName: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none font-nastaliq" placeholder="ماش سالم چمن-خام" />
                      </div>
                      <div>
                        <label className="block text-xs text-slate-400 mb-1">Unit Weight</label>
                        <select value={formProduct.unit} onChange={(e) => setFormProduct({ ...formProduct, unit: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none">
                          <option value="50Kg">50Kg</option>
                          <option value="25Kg">25Kg</option>
                          <option value="100Kg">100Kg</option>
                        </select>
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs">Save Product</button>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
