                      <i data-lucide={item.icon} className={`w-4 h-4 ${isActive ? 'text-amber-400' : 'text-slate-400'}`}></i>

        const [lang, setLang] = useState('ur'); // Default to Urdu & English bilingual mode
        const [activeTab, setActiveTab] = useState('dashboard');

          }

        return (
          <div className="flex min-h-screen bg-slate-950 text-slate-100">
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} lang={lang} setLang={setLang} user={user} onLogout={() => alert('Logged out')} />
            <div className="flex-1 flex flex-col min-w-0">
              <Header lang={lang} setLang={setLang} />
              <main className="flex-1 p-6 overflow-y-auto">

      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
