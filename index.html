<!DOCTYPE html>
<html lang="ur" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محمد دال فیکٹری — FactoryFlow Pro Enterprise ERP</title>
    
    <!-- Google Fonts: Noto Nastaliq Urdu + Inter + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fffbe6',
                100: '#fff3b3',
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
                800: '#92400e',
              },
              dark: {
                950: '#0a0e17',
                900: '#101522',
                850: '#161c2e',
                800: '#1c243b',
                750: '#242f4c',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              urdu: ['Noto Nastaliq Urdu', 'serif'],
            },
          },
        },
      };
    </script>

    <!-- React 18, Babel & html2pdf.js CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0a0e17; }
      ::-webkit-scrollbar-thumb { background: #1c243b; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
      .font-nastaliq { font-family: 'Noto Nastaliq Urdu', serif; line-height: 1.85; }
      .glow-amber { box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.4); }
      .glow-card { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5); }
    </style>
  </head>
  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Seed Data matching Apper codebase & screenshots
      const initialRoznamcha = [
        { id: 'ROZ-101', date: '2026-07-25', party: 'حاجی اسلم غلہ منڈی', description: 'چنا 200 بوری کی پیشگی ادائیگی', type: 'Cash Paid', amount: 150000, voucher: 'V-8801' },
        { id: 'ROZ-102', date: '2026-07-25', party: 'فیصل آباد ٹریڈرز', description: 'دال مونگ فروخت وصولی', type: 'Cash Received', amount: 280000, voucher: 'V-8802' },
      ];

      const initialWorkers = [
        { id: '1', name: 'محمد رمضان', category: 'دھلائی', phone: '0300-1234567', city: 'فیصل آباد', dailyWage: 2500, attendance: 'Present' },
        { id: '2', name: 'طارق محمود', category: 'دلائی', phone: '0313-7654321', city: 'فیصل آباد', dailyWage: 2200, attendance: 'Present' },
        { id: '3', name: 'اللہ دتہ', category: 'رکشہ والا', phone: '0321-9988776', city: 'فیصل آباد', dailyWage: 1800, attendance: 'Present' },
      ];

      const initialSales = [
        {
          id: '1',
          invoiceNumber: 'INV-901',
          partyName: 'فیصل آباد ہول سیل ٹریڈرز',
          productNameUrdu: 'دال ماش ایس کیو (Special)',
          toriQuantity: 250, // 250 Bags
          khotPerTori: 2, // 2 KG Khot per Bag
          ratePerMan: 6800, // PKR per 40KG Maund
          totalKG: 12500,
          totalKhotKG: 500,
          netWeightKG: 12000,
          netWeightMan: 300, // 300 Maunds
          totalAmount: 2040000,
          expenses: 5000,
          previousBalance: 150000,
          date: '2026-07-25',
          status: 'Delivered',
        }
      ];

      const initialProducts = [
        { id: '#1', urduName: 'ماش سالم ایس کیو-خام', unit: '50Kg', stockBags: 1200, rate: 6800 },
        { id: '#2', urduName: 'ماش سالم ایف کیو-خام', unit: '50Kg', stockBags: 850, rate: 6600 },
        { id: '#3', urduName: 'ماش سالم ژوب-خام', unit: '50Kg', stockBags: 620, rate: 6500 },
        { id: '#4', urduName: 'ماش سالم لورالائی-خام', unit: '50Kg', stockBags: 410, rate: 6700 },
        { id: '#5', urduName: 'ماش سالم چمن-خام', unit: '50Kg', stockBags: 980, rate: 6900 },
        { id: '#6', urduName: 'دال ماش ایس کیو', unit: '25Kg', stockBags: 2400, rate: 8400 },
      ];

      const initialBrokers = [
        { id: '1', name: 'سوڑی کھاتہ', code: 'مستقل کھاتہ', rate: 'Current Rate: 0', type: 'Broker' }
      ];

      const App = () => {
        const [user, setUser] = useState({ name: 'Abdullah Dilbar', role: 'Administrator' });
        const [activeTab, setActiveTab] = useState('dashboard');
        const [searchQuery, setSearchQuery] = useState('');
        const [workerFilter, setWorkerFilter] = useState('سب');
        const [partyTab, setPartyTab] = useState('parties');

        const [showAdminMenu, setShowAdminMenu] = useState(false);
        const [activeModal, setActiveModal] = useState(null); // 'roznamcha', 'worker', 'invoicePreview', 'product'
        const [selectedInvoice, setSelectedInvoice] = useState(null);
        const [toastMessage, setToastMessage] = useState(null);

        // Data collections
        const [roznamchaList, setRoznamchaList] = useState(initialRoznamcha);
        const [workersList, setWorkersList] = useState(initialWorkers);
        const [salesList, setSalesList] = useState(initialSales);
        const [productsList, setProductsList] = useState(initialProducts);

        // Form Drafts
        const [formSale, setFormSale] = useState({
          partyName: 'فیصل آباد ٹریڈرز',
          productNameUrdu: 'دال ماش ایس کیو',
          toriQuantity: 100,
          khotPerTori: 2,
          ratePerMan: 6800,
          expenses: 2000,
        });

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [activeTab, activeModal, selectedInvoice, salesList, roznamchaList]);

        const triggerToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(null), 4000);
        };

        // Calculate Sale Invoice
        const handleCreateSale = (e) => {
          e.preventDefault();
          const bags = parseFloat(formSale.toriQuantity) || 0;
          const khot = parseFloat(formSale.khotPerTori) || 0;
          const rate = parseFloat(formSale.ratePerMan) || 0;
          const exp = parseFloat(formSale.expenses) || 0;

          const totalKG = bags * 50;
          const totalKhotKG = bags * khot;
          const netWeightKG = totalKG - totalKhotKG;
          const netWeightMan = netWeightKG / 40; // 40KG per Maund
          const totalAmount = (netWeightMan * rate) + exp;

          const newSale = {
            id: (salesList.length + 1).toString(),
            invoiceNumber: `INV-${Math.floor(900 + Math.random() * 100)}`,
            partyName: formSale.partyName,
            productNameUrdu: formSale.productNameUrdu,
            toriQuantity: bags,
            khotPerTori: khot,
            ratePerMan: rate,
            totalKG: totalKG,
            totalKhotKG: totalKhotKG,
            netWeightKG: netWeightKG,
            netWeightMan: netWeightMan,
            totalAmount: totalAmount,
            expenses: exp,
            previousBalance: 120000,
            date: new Date().toISOString().split('T')[0],
            status: 'Delivered',
          };

          setSalesList([newSale, ...salesList]);
          setActiveModal(null);
          triggerToast('فروخت کا نیا بل کامیابی سے بن گیا!');
        };

        // Print PDF Invoice using html2pdf.js
        const handlePrintPDF = (inv) => {
          const element = document.getElementById('printable-invoice');
          if (window.html2pdf && element) {
            const opt = {
              margin: 5,
              filename: `Bill_${inv.invoiceNumber}.pdf`,
              image: { type: 'jpeg', quality: 0.98 },
              html2canvas: { scale: 2 },
              jsPDF: { unit: 'mm', format: 'a5', orientation: 'portrait' }
            };
            window.html2pdf().set(opt).from(element).save();
          } else {
            window.print();
          }
        };

        // Totals
        const totalCashReceived = roznamchaList.filter(r => r.type === 'Cash Received').reduce((acc, r) => acc + r.amount, 0);
        const totalCashPaid = roznamchaList.filter(r => r.type === 'Cash Paid').reduce((acc, r) => acc + r.amount, 0);
        const currentRokar = 500000 + totalCashReceived - totalCashPaid;

        const navItems = [
          { id: 'dashboard', labelUr: 'خلاصہ', labelEn: 'Dashboard', icon: 'layout-dashboard' },
          { id: 'daybook', labelUr: 'روزنامچہ', labelEn: 'Day-Book', icon: 'book-open' },
          { id: 'workers', labelUr: 'کارکنان', labelEn: 'Workers', icon: 'users' },
          { id: 'purchase', labelUr: 'خرید', labelEn: 'Purchase', icon: 'shopping-cart' },
          { id: 'sale', labelUr: 'فروخت', labelEn: 'Sale', icon: 'trending-up' },
          { id: 'parties', labelUr: 'پارٹیز', labelEn: 'Parties', icon: 'user-check' },
          { id: 'products', labelUr: 'اشیاء', labelEn: 'Products', icon: 'package' },
          { id: 'gatepass', labelUr: 'گیٹ پاس', labelEn: 'Gate Pass', icon: 'ticket' },
        ];

        return (
          <div className="flex min-h-screen bg-dark-950 text-slate-100 font-nastaliq">
            {/* Toast Banner */}
            {toastMessage && (
              <div className="fixed top-6 left-6 z-50 bg-dark-850 border border-sky-500/40 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce">
                <i data-lucide="info" className="w-4 h-4 text-sky-400"></i>
                <span className="text-xs font-bold font-nastaliq">{toastMessage}</span>
              </div>
            )}

            {/* Sidebar */}
            <aside className="w-64 bg-dark-900 border-l border-dark-800 flex flex-col h-screen sticky top-0 z-30">
              <div className="p-4 border-b border-dark-800 flex items-center gap-3 bg-dark-950/50">
                <div className="p-2.5 bg-brand-500 rounded-xl text-black font-bold shadow-lg shadow-brand-500/20">
                  <i data-lucide="factory" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="font-display font-bold text-sm text-brand-500 tracking-tight leading-tight">محمد دال فیکٹری</h1>
                  <p className="text-[11px] text-slate-400">چک 230 آر بی چوہلہ، فیصل آباد</p>
                </div>
              </div>

              <nav className="flex-1 overflow-y-auto p-3 space-y-1">
                {navItems.map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                        isActive ? 'bg-brand-500 text-black shadow-lg shadow-brand-500/25' : 'text-slate-300 hover:text-white hover:bg-dark-800/80'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <i data-lucide={item.icon} className={`w-4 h-4 ${isActive ? 'text-black' : 'text-slate-400'}`}></i>
                        <span className="text-sm">{item.labelUr}</span>
                      </div>
                      <span className={`text-[10px] font-mono ${isActive ? 'text-black' : 'text-slate-500'}`}>{item.labelEn}</span>
                    </button>
                  );
                })}
              </nav>

              <div className="p-4 border-t border-dark-800 bg-dark-950/60 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-brand-500/20 text-brand-500 flex items-center justify-center font-bold text-xs border border-brand-500/40">A</div>
                  <div>
                    <p className="text-xs font-bold text-slate-100">عبداللہ دلبر</p>
                    <p className="text-[10px] text-brand-500">مالک فیکٹری</p>
                  </div>
                </div>
              </div>
            </aside>

            {/* Main Application Container */}
            <div className="flex-1 flex flex-col min-w-0">
              {/* Header Bar */}
              <header className="h-16 bg-dark-900/90 backdrop-blur border-b border-dark-800 px-6 flex items-center justify-between sticky top-0 z-20">
                <div>
                  <h2 className="text-base font-bold text-slate-100 font-display">محمد دال فیکٹری — فیصل آباد</h2>
                  <p className="text-xs text-slate-400">چک 230 آر بی چوہلہ، جھنگ روڈ فیصل آباد</p>
                </div>

                <div className="flex items-center gap-4">
                  <span className="text-xs font-mono text-slate-300">25-Jul-2026 • 18:46</span>
                  <a href="tel:03000676293" className="flex items-center gap-2 px-3 py-1 bg-dark-950 border border-dark-800 text-brand-500 rounded-lg text-xs font-bold font-mono">
                    <i data-lucide="phone" className="w-3.5 h-3.5"></i>
                    <span>0300-0676293</span>
                  </a>
                </div>
              </header>

              {/* Main Content Workspace */}
              <main className="flex-1 p-6 overflow-y-auto">
                {/* 1. DASHBOARD */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <h1 className="text-3xl font-bold text-slate-100">خلاصہ — ڈیش بورڈ</h1>

                    <div className="bg-gradient-to-r from-brand-900/40 via-dark-900 to-dark-900 border border-brand-500/40 rounded-2xl p-6 glow-card">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-4">
                          <div className="p-4 bg-brand-500/20 text-brand-500 rounded-2xl border border-brand-500/30">
                            <i data-lucide="wallet" className="w-8 h-8"></i>
                          </div>
                          <div>
                            <h2 className="text-2xl font-bold text-brand-500">موجودہ روکڑ</h2>
                            <p className="text-xs text-slate-400 font-sans">Current Cash Balance — Roznamcha</p>
                          </div>
                        </div>
                        <div className="text-left font-sans">
                          <span className="text-4xl font-bold font-display text-brand-500 tracking-tight">PKR {currentRokar.toLocaleString()}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. SALES (فروخت) WITH PRINTABLE A5 URDU INVOICES */}
                {activeTab === 'sale' && (
                  <div className="space-y-6">
                    <div className="flex items-center justify-between">
                      <h1 className="text-3xl font-bold text-slate-100">فروخت — Sales & Invoices</h1>
                      <button onClick={() => setActiveModal('createSale')} className="bg-brand-500 hover:bg-brand-600 text-black text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg shadow-brand-500/20">
                        <i data-lucide="plus" className="w-4 h-4"></i>
                        <span>+ نیا بل (Create Sale Invoice)</span>
                      </button>
                    </div>

                    <div className="bg-dark-900 border border-dark-800 rounded-xl overflow-hidden">
                      <table className="w-full text-right border-collapse">
                        <thead>
                          <tr className="border-b border-dark-800 bg-dark-950 text-[11px] font-bold text-slate-400 uppercase">
                            <th className="p-4">بل نمبر</th>
                            <th className="p-4">پارٹی نام</th>
                            <th className="p-4">جنس / دال</th>
                            <th className="p-4">توری (بوری)</th>
                            <th className="p-4">خالص وزن (من)</th>
                            <th className="p-4">کل رقم (PKR)</th>
                            <th className="p-4 text-center">پرنٹ / ایکشن</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-dark-800 text-xs">
                          {salesList.map((s) => (
                            <tr key={s.id} className="hover:bg-dark-850/60">
                              <td className="p-4 font-mono font-bold text-brand-500">{s.invoiceNumber}</td>
                              <td className="p-4 font-bold text-slate-200">{s.partyName}</td>
                              <td className="p-4 text-slate-300 font-semibold">{s.productNameUrdu}</td>
                              <td className="p-4 font-mono text-slate-100">{s.toriQuantity} بوری</td>
                              <td className="p-4 font-mono font-bold text-emerald-400">{s.netWeightMan} من</td>
                              <td className="p-4 font-mono font-bold text-sky-400">PKR {s.totalAmount.toLocaleString()}</td>
                              <td className="p-4 text-center">
                                <button
                                  onClick={() => { setSelectedInvoice(s); setActiveModal('invoicePreview'); }}
                                  className="px-3 py-1.5 bg-brand-500/10 hover:bg-brand-500/20 text-brand-500 border border-brand-500/30 rounded-lg text-xs font-bold flex items-center gap-1.5 mx-auto"
                                >
                                  <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                                  <span>بل پرنٹ دیکھیں</span>
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>
            </div>

            {/* MODALS */}
            {activeModal === 'createSale' && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-dark-900 border border-dark-800 rounded-2xl p-6 w-full max-w-lg shadow-2xl space-y-4">
                  <h3 className="text-xl font-bold text-brand-500">نیا فروخت بل بنائیں — Create Invoice</h3>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">خریدار پارٹی (Party Name)</label>
                    <input type="text" value={formSale.partyName} onChange={(e) => setFormSale({ ...formSale, partyName: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">دال / جنس (Pulse Product)</label>
                    <input type="text" value={formSale.productNameUrdu} onChange={(e) => setFormSale({ ...formSale, productNameUrdu: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" />
                  </div>
                  <div className="grid grid-cols-3 gap-3 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1">توری / بوری</label>
                      <input type="number" value={formSale.toriQuantity} onChange={(e) => setFormSale({ ...formSale, toriQuantity: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-slate-100 font-mono" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">کھوٹ (KG/Bag)</label>
                      <input type="number" value={formSale.khotPerTori} onChange={(e) => setFormSale({ ...formSale, khotPerTori: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-slate-100 font-mono" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">ریٹ فی من (PKR)</label>
                      <input type="number" value={formSale.ratePerMan} onChange={(e) => setFormSale({ ...formSale, ratePerMan: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-slate-100 font-mono" />
                    </div>
                  </div>
                  <button onClick={handleCreateSale} className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs">بل بنائیں اور محفوظ کریں</button>
                </div>
              </div>
            )}

            {/* PRINTABLE A5 URDU INVOICE PREVIEW MODAL */}
            {activeModal === 'invoicePreview' && selectedInvoice && (
              <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-dark-900 border border-dark-800 rounded-2xl p-6 w-full max-w-xl shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                  <div className="flex items-center justify-between pb-3 border-b border-dark-800">
                    <h3 className="text-lg font-bold text-brand-500">بل پرنٹ پیش نظارہ (A5 Printable Urdu Invoice)</h3>
                    <button onClick={() => setActiveModal(null)} className="text-slate-400 hover:text-white p-1">
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  {/* Printable Invoice Sheet */}
                  <div id="printable-invoice" className="bg-white text-black p-6 rounded-xl space-y-4 font-nastaliq text-xs shadow-inner">
                    <div className="text-center border-b pb-3 border-black">
                      <h2 className="text-xl font-bold text-black">محمد دال اینڈ گرین ملز</h2>
                      <p className="text-[11px] text-slate-700">چک 230 آر بی چوہلہ، جھنگ روڈ فیصل آباد • فون: 0300-0676293</p>
                    </div>

                    <div className="flex justify-between text-[11px] border-b pb-2 border-slate-300">
                      <div>
                        <p><strong>خریدار:</strong> {selectedInvoice.partyName}</p>
                        <p><strong>تاریخ:</strong> {selectedInvoice.date}</p>
                      </div>
                      <div className="text-left font-mono">
                        <p><strong>بل نمبر:</strong> {selectedInvoice.invoiceNumber}</p>
                      </div>
                    </div>

                    <table className="w-full text-right border-collapse border border-slate-400">
                      <thead>
                        <tr className="bg-slate-100 font-bold border-b border-slate-400">
                          <th className="p-2 border-r border-slate-400">جنس</th>
                          <th className="p-2 border-r border-slate-400">توری</th>
                          <th className="p-2 border-r border-slate-400">کھوٹ</th>
                          <th className="p-2 border-r border-slate-400">خالص من</th>
                          <th className="p-2 border-r border-slate-400">ریٹ فی من</th>
                          <th className="p-2">کل رقم</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr className="border-b border-slate-300">
                          <td className="p-2 border-r border-slate-300 font-bold">{selectedInvoice.productNameUrdu}</td>
                          <td className="p-2 border-r border-slate-300 font-mono">{selectedInvoice.toriQuantity} بوری</td>
                          <td className="p-2 border-r border-slate-300 font-mono">{selectedInvoice.khotPerTori} KG</td>
                          <td className="p-2 border-r border-slate-300 font-mono">{selectedInvoice.netWeightMan} من</td>
                          <td className="p-2 border-r border-slate-300 font-mono">{selectedInvoice.ratePerMan}</td>
                          <td className="p-2 font-mono font-bold">PKR {selectedInvoice.totalAmount.toLocaleString()}</td>
                        </tr>
                      </tbody>
                    </table>

                    <div className="flex justify-between items-end pt-2 text-xs">
                      <div>
                        <p>سابقہ کھاتہ (Previous): <strong>PKR {selectedInvoice.previousBalance.toLocaleString()}</strong></p>
                        <p className="text-sm font-bold text-brand-600 mt-1">کل قابل ادا کھاتہ: PKR {(selectedInvoice.totalAmount + selectedInvoice.previousBalance).toLocaleString()}</p>
                      </div>
                      <div className="text-left pt-6 border-t border-black">
                        <p className="font-bold">دستخط منشی / مالک</p>
                      </div>
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-2">
                    <button onClick={() => handlePrintPDF(selectedInvoice)} className="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs flex items-center gap-2">
                      <i data-lucide="download" className="w-4 h-4"></i>
                      <span>A5 PDF پرنٹ کریں / ڈاؤن لوڈ کریں</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
