<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Muhammad Daal Factory - Enterprise Management System v2.5 (محمد دال فیکٹری)</title>
    
    <!-- Modern Typography: Inter + Space Grotesk + Noto Nastaliq Urdu -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fffbe6',
                100: '#fff3b3',
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
                800: '#92400e',
              },
              dark: {
                950: '#0c1017',
                900: '#121620',
                850: '#181e2b',
                800: '#1e2536',
                750: '#263045',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              urdu: ['Noto Nastaliq Urdu', 'serif'],
            },
          },
        },
      };
    </script>

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons & Supabase JS SDK -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0c1017; }
      ::-webkit-scrollbar-thumb { background: #1e2536; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
      .font-nastaliq { font-family: 'Noto Nastaliq Urdu', serif; line-height: 1.8; }
      .glow-card { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5); }
      .glow-active { box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.4); }
    </style>
  </head>
  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const initialRoznamcha = [
        { id: 'ROZ-101', date: '2026-07-25', party: 'حاجی اسلم غلہ منڈی (Haji Aslam Grain)', description: 'چنا 200 بوری کی پیشگی ادائیگی', type: 'Cash Paid', amount: 150000, voucher: 'V-8801' },
        { id: 'ROZ-102', date: '2026-07-25', party: 'فیصل آباد ٹریڈرز (Faisalabad Traders)', description: 'دال مونگ فروخت وصولی', type: 'Cash Received', amount: 280000, voucher: 'V-8802' },
      ];

      const initialWorkers = [
        { id: '1', name: 'محمد رمضان (Muhammad Ramzan)', category: 'دھلائی', phone: '0300-1234567', city: 'فیصل آباد', dailyWage: 2500, attendance: 'Present' },
      ];

      const App = () => {
        const [user, setUser] = useState({ name: 'Abdullah Dilbar', email: 'admin@factoryflow.com', role: 'Admin' });
        const [activeTab, setActiveTab] = useState('dashboard');
        const [displayLang, setDisplayLang] = useState('ur');
        const [showAdminMenu, setShowAdminMenu] = useState(false);
        const [activeModal, setActiveModal] = useState(null); // 'changePassword', 'languageModal', 'roznamcha'
        const [toastMessage, setToastMessage] = useState(null);

        // Forms
        const [formLogin, setFormLogin] = useState({ username: 'admin@factoryflow.com', password: 'password123', role: 'Admin' });
        const [formPassword, setFormPassword] = useState({ current: '', newPass: '', confirm: '' });
        const [roznamchaList, setRoznamchaList] = useState(initialRoznamcha);

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [user, activeTab, displayLang, showAdminMenu, activeModal, toastMessage]);

        const triggerToast = (msg) => {
          setToastMessage(msg);
          setTimeout(() => setToastMessage(null), 4000);
        };

        const handleLogout = () => {
          setUser(null);
          setShowAdminMenu(false);
          triggerToast('آپ لاگ آؤٹ ہو گئے۔');
        };

        const handleLogin = (e) => {
          e.preventDefault();
          const roleName = formLogin.role === 'Admin' ? 'Admin' : 'Receptionist (منشی)';
          setUser({
            name: formLogin.role === 'Admin' ? 'Abdullah Dilbar' : 'Munshi Shabbir',
            email: formLogin.username || 'admin@factoryflow.com',
            role: roleName,
          });
          triggerToast(`کامیابی سے لاگ ان ہو گئے! Panel: ${roleName}`);
        };

        const handleChangePassword = (e) => {
          e.preventDefault();
          if (formPassword.newPass !== formPassword.confirm) {
            alert('پاسورڈ کی تصدیق نہیں ملی! (Passwords do not match)');
            return;
          }
          setActiveModal(null);
          setFormPassword({ current: '', newPass: '', confirm: '' });
          triggerToast('پاسورڈ کامیابی سے تبدیل ہو گیا!');
        };

        const toggleLanguage = (langKey) => {
          setDisplayLang(langKey);
          setActiveModal(null);
          triggerToast(langKey === 'ur' ? 'اردو زبان منتخب ہو گئی!' : 'English Language Activated!');
        };

        const navItems = [
          { id: 'dashboard', labelEn: 'Dashboard', labelUr: 'خلاصہ', icon: 'layout-dashboard' },
          { id: 'daybook', labelEn: 'Day-Book', labelUr: 'روزنامچہ', icon: 'book-open' },
          { id: 'workers', labelEn: 'Workers', labelUr: 'کارکنان', icon: 'users' },
          { id: 'purchase', labelEn: 'Purchase', labelUr: 'خرید', icon: 'shopping-cart' },
          { id: 'sale', labelEn: 'Sale', labelUr: 'فروخت', icon: 'trending-up' },
          { id: 'parties', labelEn: 'Parties', labelUr: 'پارٹیز', icon: 'user-check' },
          { id: 'products', labelEn: 'Products', labelUr: 'اشیاء', icon: 'package' },
          { id: 'stock', labelEn: 'Stock', labelUr: 'مال / کھاتہ', icon: 'boxes' },
          { id: 'gatepass', labelEn: 'Gate Pass', labelUr: 'گیٹ پاس', icon: 'ticket' },
          { id: 'languageTab', labelEn: 'Language Switcher', labelUr: 'زبان تبدیل کریں', icon: 'languages' },
          { id: 'reports', labelEn: 'Reports', labelUr: 'رپورٹس', icon: 'bar-chart-3' },
        ];

        if (!user) {
          return (
            <div className="min-h-screen bg-dark-950 flex flex-col items-center justify-center p-4 relative font-sans">
              <div className="w-full max-w-md bg-dark-900 border border-dark-800 rounded-2xl p-8 shadow-2xl space-y-6">
                <div className="flex flex-col items-center text-center space-y-2">
                  <div className="p-3 bg-brand-500/20 text-brand-500 rounded-2xl border border-brand-500/40 shadow-lg shadow-brand-500/20">
                    <i data-lucide="factory" className="w-8 h-8"></i>
                  </div>
                  <h1 className="text-2xl font-bold font-display text-slate-100">Muhammad Daal Factory</h1>
                  <p className="text-xs text-slate-400 font-medium">Chak 230 RB Chohla, Jhang Road Faisalabad</p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <h3 className="text-base font-bold text-slate-100">Sign In to Mill Portal</h3>
                    <p className="text-xs text-slate-400">Enter credentials & select access panel</p>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Select Panel Mode</label>
                    <select
                      value={formLogin.role}
                      onChange={(e) => setFormLogin({ ...formLogin, role: e.target.value })}
                      className="w-full bg-dark-950 border border-dark-800 rounded-xl px-3 py-2.5 text-xs text-brand-500 font-bold outline-none"
                    >
                      <option value="Admin">Factory Owner / Admin (مالک پینل)</option>
                      <option value="Receptionist">Munshi / Receptionist (منشی پینل)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Username or Email</label>
                    <div className="relative">
                      <i data-lucide="user" className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                      <input
                        type="text"
                        required
                        value={formLogin.username}
                        onChange={(e) => setFormLogin({ ...formLogin, username: e.target.value })}
                        className="w-full bg-dark-950 border border-dark-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-100 outline-none focus:border-brand-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                    <div className="relative">
                      <i data-lucide="lock" className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>
                      <input
                        type="password"
                        required
                        value={formLogin.password}
                        onChange={(e) => setFormLogin({ ...formLogin, password: e.target.value })}
                        className="w-full bg-dark-950 border border-dark-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-slate-100 outline-none focus:border-brand-500"
                      />
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-brand-500/25">
                    <i data-lucide="log-in" className="w-4 h-4"></i>
                    <span>Sign In</span>
                  </button>
                </form>
              </div>
            </div>
          );
        }

        return (
          <div className="flex min-h-screen bg-dark-950 text-slate-100 font-sans relative">
            {toastMessage && (
              <div className="fixed top-6 right-6 z-50 bg-dark-850 border border-sky-500/40 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce">
                <div className="p-1 bg-sky-500/20 text-sky-400 rounded-lg">
                  <i data-lucide="info" className="w-4 h-4"></i>
                </div>
                <span className="text-xs font-bold font-nastaliq">{toastMessage}</span>
              </div>
            )}

            {/* Left Sidebar */}
            <aside className="w-64 bg-dark-900 border-r border-dark-800 flex flex-col h-screen sticky top-0 z-30">
              <div className="p-4 border-b border-dark-800 flex items-center justify-between bg-dark-950/50">
                <div className="flex items-center gap-3">
                  <div className="p-2.5 bg-brand-500 rounded-xl text-black font-bold shadow-lg shadow-brand-500/20">
                    <i data-lucide="factory" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <h1 className="font-display font-bold text-sm text-brand-500 tracking-tight leading-tight">Muhammad Daal Factory</h1>
                    <p className="text-[11px] text-slate-400 font-medium">Chohla, Faisalabad</p>
                  </div>
                </div>
              </div>

              {/* Sidebar Links */}
              <nav className="flex-1 overflow-y-auto p-3 space-y-1">
                {navItems.map((item) => {
                  const isActive = activeTab === item.id;
                  const isLangTab = item.id === 'languageTab';
                  return (
                    <button
                      key={item.id}
                      onClick={() => {
                        if (isLangTab) {
                          setActiveModal('languageModal');
                        } else {
                          setActiveTab(item.id);
                        }
                      }}
                      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                        isActive || (isLangTab && activeModal === 'languageModal')
                          ? 'bg-brand-500 text-black shadow-lg shadow-brand-500/25 font-bold'
                          : isLangTab
                          ? 'bg-brand-500/10 border border-brand-500/30 text-amber-400 hover:bg-brand-500/20'
                          : 'text-slate-300 hover:text-white hover:bg-dark-800/80'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <i data-lucide={item.icon} className={`w-4 h-4 ${isActive ? 'text-black' : isLangTab ? 'text-brand-500' : 'text-slate-400'}`}></i>
                        <span>{displayLang === 'ur' ? item.labelUr : item.labelEn}</span>
                      </div>
                      <span className="font-nastaliq text-[11px] font-bold text-amber-400">{item.labelUr}</span>
                    </button>
                  );
                })}
              </nav>

              {/* Sidebar Bottom Profile Card */}
              <div className="p-4 border-t border-dark-800 bg-dark-950/60 space-y-3">
                <button
                  onClick={() => setActiveModal('languageModal')}
                  className="w-full py-2 px-3 bg-brand-500/15 hover:bg-brand-500/25 border border-brand-500/30 text-brand-500 rounded-xl text-xs font-bold flex items-center justify-between transition-colors font-nastaliq"
                >
                  <div className="flex items-center gap-2">
                    <i data-lucide="languages" className="w-4 h-4"></i>
                    <span>{displayLang === 'ur' ? 'زبان تبدیل کریں (Language)' : 'Switch Language'}</span>
                  </div>
                  <span className="text-[10px] px-1.5 py-0.5 rounded bg-brand-500/20 font-bold">
                    {displayLang === 'ur' ? 'اردو' : 'EN'}
                  </span>
                </button>

                <div className="flex items-center justify-between pt-1">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-amber-950/80 text-amber-500 flex items-center justify-center font-bold text-sm border border-amber-500/40">
                      A
                    </div>
                    <div>
                      <p className="text-xs font-bold text-slate-100">{user?.name}</p>
                      <p className="text-[11px] font-bold text-brand-500">{user?.role}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowAdminMenu(!showAdminMenu)}
                    className="p-1 text-slate-400 hover:text-white"
                  >
                    <i data-lucide="chevron-up" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </aside>

            {/* Main Workspace */}
            <div className="flex-1 flex flex-col min-w-0">
              {/* Header Bar */}
              <header className="h-16 bg-dark-900/90 backdrop-blur border-b border-dark-800 px-6 flex items-center justify-between sticky top-0 z-20">
                <div>
                  <h2 className="text-base font-bold text-slate-100 font-display">Muhammad Daal Factory</h2>
                  <p className="text-xs text-slate-400">Chak 230 RB Chohla, Jhang Road Faisalabad</p>
                </div>

                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2 text-xs font-mono text-slate-300">
                    <span>25-Jul-2026 • 18:58</span>
                  </div>

                  <a href="tel:03000676293" className="flex items-center gap-2 px-3 py-1 bg-dark-950 border border-dark-800 text-brand-500 rounded-lg text-xs font-bold">
                    <i data-lucide="phone" className="w-3.5 h-3.5"></i>
                    <span>0300-0676293</span>
                  </a>

                  {/* Top Profile Dropdown */}
                  <div className="relative">
                    <button
                      onClick={() => setShowAdminMenu(!showAdminMenu)}
                      className="flex items-center gap-2 px-3 py-1.5 bg-dark-800 hover:bg-dark-750 rounded-lg border border-dark-700 text-xs font-bold transition-colors cursor-pointer"
                    >
                      <div className="w-5 h-5 rounded-full bg-brand-500/20 text-brand-500 flex items-center justify-center text-[10px] font-bold">A</div>
                      <span className="text-slate-200">{user?.name}</span>
                      <i data-lucide="chevron-down" className="w-3.5 h-3.5 text-slate-400"></i>
                    </button>

                    {showAdminMenu && (
                      <div className="absolute right-0 top-11 w-64 bg-dark-900 border border-dark-800 rounded-xl shadow-2xl p-3 z-50 space-y-3 font-sans">
                        <div className="pb-3 border-b border-dark-800 space-y-0.5">
                          <h4 className="text-xs font-bold text-slate-100">{user?.name}</h4>
                          <p className="text-[11px] text-slate-400">{user?.email}</p>
                          <span className="inline-block text-[10px] font-bold text-brand-500 pt-1">{user?.role}</span>
                        </div>

                        <div className="space-y-1">
                          <button
                            onClick={() => { setShowAdminMenu(false); setActiveModal('languageModal'); }}
                            className="w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold text-amber-400 hover:bg-dark-800 flex items-center justify-between transition-colors font-nastaliq"
                          >
                            <span>زبان تبدیل کریں (Language Settings)</span>
                            <i data-lucide="languages" className="w-4 h-4 text-brand-500"></i>
                          </button>

                          <button
                            onClick={() => { setShowAdminMenu(false); setActiveModal('changePassword'); }}
                            className="w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold text-slate-200 hover:bg-dark-800 flex items-center justify-between transition-colors font-nastaliq"
                          >
                            <span>پاسورڈ تبدیل کریں (Change Password)</span>
                            <i data-lucide="key" className="w-4 h-4 text-brand-500"></i>
                          </button>

                          <button
                            onClick={handleLogout}
                            className="w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold text-rose-400 hover:bg-rose-500/10 flex items-center justify-between transition-colors font-nastaliq"
                          >
                            <span>لاگ آؤٹ (Log Out)</span>
                            <i data-lucide="log-out" className="w-4 h-4 text-rose-400"></i>
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </header>

              {/* Main Workspace */}
              <main className="flex-1 p-6 overflow-y-auto">
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <h1 className="text-3xl font-bold text-slate-100 font-nastaliq">{displayLang === 'ur' ? 'خلاصہ' : 'Dashboard Overview'}</h1>
                    <button onClick={() => setActiveModal('roznamcha')} className="bg-brand-500 hover:bg-brand-600 text-black text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg shadow-brand-500/20">
                      <i data-lucide="plus" className="w-4 h-4"></i>
                      <span>+ نئی اندراج</span>
                    </button>
                  </div>

                  <div className="bg-gradient-to-r from-brand-900/40 via-dark-900 to-dark-900 border border-brand-500/40 rounded-2xl p-6 glow-card">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-4">
                        <div className="p-4 bg-brand-500/20 text-brand-500 rounded-2xl border border-brand-500/30">
                          <i data-lucide="wallet" className="w-8 h-8"></i>
                        </div>
                        <div>
                          <h2 className="text-2xl font-bold text-brand-500 font-nastaliq">موجودہ روکڑ — Current Cash Balance</h2>
                          <p className="text-xs text-slate-400 mt-0.5">Roznamcha Daily Balance</p>
                        </div>
                      </div>
                      <div className="text-right">
                        <span className="text-4xl font-bold font-display text-brand-500 tracking-tight">PKR 630,000</span>
                      </div>
                    </div>
                  </div>
                </div>
              </main>
            </div>

            {/* MODALS */}
            {activeModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-dark-900 border border-dark-800 rounded-2xl p-6 w-full max-w-md shadow-2xl relative font-sans">
                  <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>

                  {/* Language Switcher Modal */}
                  {activeModal === 'languageModal' && (
                    <div className="space-y-4">
                      <div className="flex items-center gap-3 pb-3 border-b border-dark-800">
                        <div className="p-2.5 bg-brand-500/20 text-brand-500 rounded-xl border border-brand-500/30">
                          <i data-lucide="languages" className="w-6 h-6"></i>
                        </div>
                        <div>
                          <h3 className="text-xl font-bold text-slate-100 font-nastaliq">زبان منتخب کریں</h3>
                          <p className="text-xs text-slate-400">Select Preferred Interface Language</p>
                        </div>
                      </div>

                      <div className="space-y-3">
                        <button
                          onClick={() => toggleLanguage('ur')}
                          className={`w-full p-4 rounded-xl border flex items-center justify-between transition-all ${
                            displayLang === 'ur' ? 'bg-brand-500/20 border-brand-500 text-amber-400 font-bold' : 'bg-dark-950 border-dark-800 text-slate-300 hover:bg-dark-800'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="text-2xl">🇵🇰</span>
                            <div className="text-left">
                              <p className="text-base font-bold font-nastaliq">اردو (Urdu Nastaliq)</p>
                              <p className="text-xs text-slate-400 font-nastaliq">فیکٹری ڈسپلے کی زبان اردو میں منتقل کریں</p>
                            </div>
                          </div>
                          {displayLang === 'ur' && <i data-lucide="check-circle-2" className="w-5 h-5 text-brand-500"></i>}
                        </button>

                        <button
                          onClick={() => toggleLanguage('en')}
                          className={`w-full p-4 rounded-xl border flex items-center justify-between transition-all ${
                            displayLang === 'en' ? 'bg-brand-500/20 border-brand-500 text-amber-400 font-bold' : 'bg-dark-950 border-dark-800 text-slate-300 hover:bg-dark-800'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <span className="text-2xl">🇬🇧</span>
                            <div className="text-left">
                              <p className="text-base font-bold">English (UK/US)</p>
                              <p className="text-xs text-slate-400">Switch system interface to English</p>
                            </div>
                          </div>
                          {displayLang === 'en' && <i data-lucide="check-circle-2" className="w-5 h-5 text-brand-500"></i>}
                        </button>
                      </div>
                    </div>
                  )}

                  {/* Change Password Modal */}
                  {activeModal === 'changePassword' && (
                    <form onSubmit={handleChangePassword} className="space-y-4">
                      <div className="flex items-center gap-3 pb-3 border-b border-dark-800">
                        <div className="p-2.5 bg-brand-500/20 text-brand-500 rounded-xl border border-brand-500/30">
                          <i data-lucide="key" className="w-5 h-5"></i>
                        </div>
                        <div>
                          <h3 className="text-xl font-bold text-slate-100 font-nastaliq">پاسورڈ تبدیل کریں</h3>
                          <p className="text-xs text-slate-400 font-mono">Change Password</p>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1.5 font-nastaliq">
                          <span className="text-rose-500">*</span> موجودہ پاسورڈ
                        </label>
                        <input
                          type="password"
                          required
                          value={formPassword.current}
                          onChange={(e) => setFormPassword({ ...formPassword, current: e.target.value })}
                          className="w-full bg-dark-950 border border-dark-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 outline-none focus:border-brand-500"
                          placeholder="••••••••"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1.5 font-nastaliq">
                          <span className="text-rose-500">*</span> نیا پاسورڈ
                        </label>
                        <input
                          type="password"
                          required
                          value={formPassword.newPass}
                          onChange={(e) => setFormPassword({ ...formPassword, newPass: e.target.value })}
                          className="w-full bg-dark-950 border border-dark-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 outline-none focus:border-brand-500 font-nastaliq"
                          placeholder="کم از کم 6 حروف"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1.5 font-nastaliq">
                          <span className="text-rose-500">*</span> پاسورڈ کی تصدیق
                        </label>
                        <input
                          type="password"
                          required
                          value={formPassword.confirm}
                          onChange={(e) => setFormPassword({ ...formPassword, confirm: e.target.value })}
                          className="w-full bg-dark-950 border border-dark-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 outline-none focus:border-brand-500 font-nastaliq"
                          placeholder="نیا پاسورڈ دوبارہ درج کریں"
                        />
                      </div>

                      <div className="flex items-center justify-end gap-3 pt-2">
                        <button
                          type="button"
                          onClick={() => setActiveModal(null)}
                          className="px-5 py-2.5 bg-dark-800 hover:bg-dark-750 text-slate-300 rounded-xl text-xs font-bold font-nastaliq"
                        >
                          منسوخ
                        </button>
                        <button
                          type="submit"
                          className="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs shadow-lg shadow-brand-500/25 font-nastaliq"
                        >
                          محفوظ کریں
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
