<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Daal Factory - Enterprise Factory Management System</title>
    
    <!-- Modern Typography: Inter + Space Grotesk + Noto Nastaliq Urdu -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fffbe6',
                100: '#fff3b3',
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
                800: '#92400e',
                900: '#78350f',
              },
              dark: {
                950: '#0b0f19',
                900: '#121726',
                850: '#182033',
                800: '#1f2942',
                750: '#283554',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              urdu: ['Noto Nastaliq Urdu', 'serif'],
            },
          },
        },
      };
    </script>

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0b0f19; }
      ::-webkit-scrollbar-thumb { background: #1f2942; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
      .font-nastaliq { font-family: 'Noto Nastaliq Urdu', serif; line-height: 1.9; }
      .glow-amber { box-shadow: 0 0 20px -5px rgba(245, 158, 11, 0.3); }
      .glow-card { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5); }
    </style>
  </head>
  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Initial Seed Data for Complete Interactive Functionality
      const initialRoznamcha = [
        { id: 'ROZ-101', date: '2026-07-25', party: 'Haji Aslam Grain Supplier', description: 'Chana Pulse 200 Bags Advance Payment', type: 'Cash Paid', amount: 150000, voucher: 'V-8801' },
        { id: 'ROZ-102', date: '2026-07-25', party: 'Faisalabad Traders', description: 'Daal Moong Sale Receipt', type: 'Cash Received', amount: 280000, voucher: 'V-8802' },
        { id: 'ROZ-103', date: '2026-07-24', party: 'Chaudhry Transport', description: 'Truck Gatepass Freight Charges', type: 'Cash Paid', amount: 25000, voucher: 'V-8803' },
      ];

      const initialWorkers = [
        { id: 'WRK-01', name: 'Muhammad Ramzan', role: 'Chief Mill Operator', shift: 'Day Shift', dailyWage: 2500, attendance: 'Present', status: 'Paid' },
        { id: 'WRK-02', name: 'Tariq Mehmood', role: 'Packaging Incharge', shift: 'Day Shift', dailyWage: 2000, attendance: 'Present', status: 'Pending' },
        { id: 'WRK-03', name: 'Shahid Iqbal', role: 'Gate Inspector', shift: 'Night Shift', dailyWage: 1800, attendance: 'Present', status: 'Paid' },
        { id: 'WRK-04', name: 'Allah Ditta', role: 'Loading Loader', shift: 'Day Shift', dailyWage: 1600, attendance: 'Absent', status: 'Unpaid' },
      ];

      const initialPurchases = [
        { id: 'PUR-501', supplier: 'Haji Aslam Grain Co', item: 'Raw Chana Pulse', bags: 500, ratePerMaund: 6800, total: 3400000, date: '2026-07-25', status: 'Received' },
        { id: 'PUR-502', supplier: 'Sargodha Agricultural Mills', item: 'Raw Moong Pulse', bags: 300, ratePerMaund: 7400, total: 2220000, date: '2026-07-24', status: 'In Transit' },
      ];

      const initialSales = [
        { id: 'INV-901', customer: 'Faisalabad Wholesale Traders', item: 'Processed Daal Chana (A-Grade)', bags: 250, rate: 8200, total: 2050000, date: '2026-07-25', status: 'Delivered' },
        { id: 'INV-902', customer: 'Lahore Grocery Supermarket', item: 'Polished Daal Moong', bags: 150, rate: 9100, total: 1365000, date: '2026-07-24', status: 'Dispatched' },
      ];

      const initialParties = [
        { id: 'PRT-01', name: 'Haji Aslam Grain Supplier', category: 'Supplier', city: 'Sargodha', phone: '0300-6543210', balance: 450000, type: 'Payable' },
        { id: 'PRT-02', name: 'Faisalabad Traders', category: 'Customer', city: 'Faisalabad', phone: '0313-9876543', balance: 820000, type: 'Receivable' },
        { id: 'PRT-03', name: 'Chaudhry Transport Co', category: 'Transporter', city: 'Faisalabad', phone: '0321-4455667', balance: 35000, type: 'Payable' },
      ];

      const initialProducts = [
        { sku: 'PROD-CHANA-A', name: 'Daal Chana Special (دال چنا)', bagWeight: '50 KG', stockBags: 1250, rate: 8200, category: 'Finished Goods' },
        { sku: 'PROD-MOONG-P', name: 'Daal Moong Polished (دال مونگ)', bagWeight: '50 KG', stockBags: 840, rate: 9100, category: 'Finished Goods' },
        { sku: 'PROD-MASOOR-W', name: 'Daal Masoor Whole (دال مسور)', bagWeight: '50 KG', stockBags: 620, rate: 7800, category: 'Finished Goods' },
        { sku: 'PROD-CHANA-RAW', name: 'Raw Unprocessed Chana (کچی چنا)', bagWeight: '100 KG', stockBags: 3400, rate: 6800, category: 'Raw Materials' },
      ];

      const initialGatePasses = [
        { id: 'GP-4001', truckNo: 'FSD-7892', driver: 'Rashid Khan', type: 'Outward Sale', goods: '250 Bags Daal Chana', netWeight: '12,500 KG', time: '04:30 PM', status: 'Passed' },
        { id: 'GP-4002', truckNo: 'SGD-4410', driver: 'Kashif Ali', type: 'Inward Purchase', goods: '500 Bags Raw Pulse', netWeight: '50,000 KG', time: '01:15 PM', status: 'Cleared' },
      ];

      // App Component
      const App = () => {
        const [activeTab, setActiveTab] = useState('dashboard');
        const [lang, setLang] = useState('ur'); // 'ur' or 'en'
        const [searchQuery, setSearchQuery] = useState('');
        const [selectedDate, setSelectedDate] = useState('2026-07-25');

        // Dynamic State Storage
        const [roznamchaList, setRoznamchaList] = useState(initialRoznamcha);
        const [workersList, setWorkersList] = useState(initialWorkers);
        const [purchasesList, setPurchasesList] = useState(initialPurchases);
        const [salesList, setSalesList] = useState(initialSales);
        const [partiesList, setPartiesList] = useState(initialParties);
        const [productsList, setProductsList] = useState(initialProducts);
        const [gatePassesList, setGatePassesList] = useState(initialGatePasses);

        // Modal Form Controls
        const [activeModal, setActiveModal] = useState(null); // 'roznamcha', 'worker', 'purchase', 'sale', 'party', 'product', 'gatepass'

        // Form Draft States
        const [formRoznamcha, setFormRoznamcha] = useState({ party: '', description: '', type: 'Cash Received', amount: '', voucher: '' });
        const [formWorker, setFormWorker] = useState({ name: '', role: 'Operator', shift: 'Day Shift', dailyWage: '' });
        const [formPurchase, setFormPurchase] = useState({ supplier: '', item: 'Raw Chana Pulse', bags: '', ratePerMaund: '' });
        const [formSale, setFormSale] = useState({ customer: '', item: 'Processed Daal Chana (A-Grade)', bags: '', rate: '' });
        const [formParty, setFormParty] = useState({ name: '', category: 'Customer', city: 'Faisalabad', phone: '', balance: '' });
        const [formProduct, setFormProduct] = useState({ sku: '', name: '', bagWeight: '50 KG', stockBags: '', rate: '' });
        const [formGatePass, setFormGatePass] = useState({ truckNo: '', driver: '', type: 'Outward Sale', goods: '', netWeight: '' });

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [activeTab, lang, activeModal, roznamchaList, workersList, purchasesList, salesList]);

        // Handlers to Add Data
        const handleAddRoznamcha = (e) => {
          e.preventDefault();
          const newEntry = {
            id: `ROZ-${Date.now().toString().slice(-4)}`,
            date: selectedDate,
            party: formRoznamcha.party || 'General Ledger Party',
            description: formRoznamcha.description || 'Cash Transaction',
            type: formRoznamcha.type,
            amount: parseFloat(formRoznamcha.amount) || 0,
            voucher: formRoznamcha.voucher || `V-${Math.floor(1000 + Math.random() * 9000)}`,
          };
          setRoznamchaList([newEntry, ...roznamchaList]);
          setActiveModal(null);
          setFormRoznamcha({ party: '', description: '', type: 'Cash Received', amount: '', voucher: '' });
        };

        const handleAddWorker = (e) => {
          e.preventDefault();
          const newWorker = {
            id: `WRK-${Date.now().toString().slice(-3)}`,
            name: formWorker.name,
            role: formWorker.role,
            shift: formWorker.shift,
            dailyWage: parseFloat(formWorker.dailyWage) || 2000,
            attendance: 'Present',
            status: 'Paid',
          };
          setWorkersList([...workersList, newWorker]);
          setActiveModal(null);
          setFormWorker({ name: '', role: 'Operator', shift: 'Day Shift', dailyWage: '' });
        };

        const handleAddPurchase = (e) => {
          e.preventDefault();
          const bags = parseFloat(formPurchase.bags) || 0;
          const rate = parseFloat(formPurchase.ratePerMaund) || 0;
          const total = (bags * 1.25) * rate; // maunds conversion approx
          const newPurchase = {
            id: `PUR-${Date.now().toString().slice(-3)}`,
            supplier: formPurchase.supplier || 'Raw Grain Supplier',
            item: formPurchase.item,
            bags: bags,
            ratePerMaund: rate,
            total: total,
            date: selectedDate,
            status: 'Received',
          };
          setPurchasesList([newPurchase, ...purchasesList]);
          setActiveModal(null);
          setFormPurchase({ supplier: '', item: 'Raw Chana Pulse', bags: '', ratePerMaund: '' });
        };

        const handleAddSale = (e) => {
          e.preventDefault();
          const bags = parseFloat(formSale.bags) || 0;
          const rate = parseFloat(formSale.rate) || 0;
          const total = bags * rate;
          const newSale = {
            id: `INV-${Date.now().toString().slice(-3)}`,
            customer: formSale.customer || 'Wholesale Client',
            item: formSale.item,
            bags: bags,
            rate: rate,
            total: total,
            date: selectedDate,
            status: 'Delivered',
          };
          setSalesList([newSale, ...salesList]);
          setActiveModal(null);
          setFormSale({ customer: '', item: 'Processed Daal Chana (A-Grade)', bags: '', rate: '' });
        };

        const handleAddGatePass = (e) => {
          e.preventDefault();
          const newGP = {
            id: `GP-${Date.now().toString().slice(-4)}`,
            truckNo: formGatePass.truckNo || 'FSD-1090',
            driver: formGatePass.driver || 'Driver Express',
            type: formGatePass.type,
            goods: formGatePass.goods || 'Daal Pulse Bags',
            netWeight: formGatePass.netWeight || '10,000 KG',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            status: 'Cleared',
          };
          setGatePassesList([newGP, ...gatePassesList]);
          setActiveModal(null);
          setFormGatePass({ truckNo: '', driver: '', type: 'Outward Sale', goods: '', netWeight: '' });
        };

        // Calculations
        const totalCashReceived = roznamchaList.filter(r => r.type === 'Cash Received').reduce((acc, r) => acc + r.amount, 0);
        const totalCashPaid = roznamchaList.filter(r => r.type === 'Cash Paid').reduce((acc, r) => acc + r.amount, 0);
        const openingRokar = 500000;
        const currentRokar = openingRokar + totalCashReceived - totalCashPaid;
        const totalStockBags = productsList.reduce((acc, p) => acc + p.stockBags, 0);

        // Sidebar Navigation Configuration
        const navItems = [
          { id: 'dashboard', labelEn: 'Dashboard', labelUr: 'خلاصہ', icon: 'layout-dashboard' },
          { id: 'daybook', labelEn: 'Day-Book', labelUr: 'روزنامچہ', icon: 'book-open' },
          { id: 'workers', labelEn: 'Workers', labelUr: 'کارکنان', icon: 'users' },
          { id: 'purchase', labelEn: 'Purchase', labelUr: 'خرید', icon: 'shopping-cart' },
          { id: 'sale', labelEn: 'Sale', labelUr: 'فروخت', icon: 'trending-up' },
          { id: 'parties', labelEn: 'Parties', labelUr: 'پارٹیز', icon: 'user-check' },
          { id: 'products', labelEn: 'Products', labelUr: 'اشیاء', icon: 'package' },
          { id: 'stock', labelEn: 'Stock', labelUr: 'مال / کھاتہ', icon: 'boxes' },
          { id: 'gatepass', labelEn: 'Gate Pass', labelUr: 'گیٹ پاس', icon: 'ticket' },
          { id: 'reports', labelEn: 'Reports', labelUr: 'رپورٹس', icon: 'bar-chart-3' },
        ];

        return (
          <div className="flex min-h-screen bg-dark-950 text-slate-100">
            {/* Sidebar */}
            <aside className="w-64 bg-dark-900 border-r border-dark-800 flex flex-col h-screen sticky top-0 z-30">
              <div className="p-4 border-b border-dark-800 flex items-center gap-3 bg-dark-950/40">
                <div className="p-2.5 bg-brand-500 rounded-xl text-black font-bold shadow-lg shadow-brand-500/20">
                  <i data-lucide="factory" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="font-display font-bold text-sm text-brand-500 tracking-tight leading-tight">Muhammad Daal Factory</h1>
                  <p className="text-[11px] text-slate-400 font-medium">Chak 230 RB Chohla, Faisalabad</p>
                </div>
              </div>

              {/* Sidebar Menu Links */}
              <nav className="flex-1 overflow-y-auto p-3 space-y-1.5">
                {navItems.map((item) => {
                  const isActive = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                        isActive
                          ? 'bg-brand-500 text-black shadow-lg shadow-brand-500/25 font-bold'
                          : 'text-slate-300 hover:text-white hover:bg-dark-800/80'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <i data-lucide={item.icon} className={`w-4 h-4 ${isActive ? 'text-black' : 'text-slate-400'}`}></i>
                        <span>{item.labelEn}</span>
                      </div>
                      <span className={`font-nastaliq text-xs ${isActive ? 'text-black font-bold' : 'text-amber-400/90'}`}>{item.labelUr}</span>
                    </button>
                  );
                })}
              </nav>

              {/* Sidebar Profile Card & Language Switcher */}
              <div className="p-3 border-t border-dark-800 bg-dark-950/60 space-y-2">
                <button
                  onClick={() => setLang(lang === 'ur' ? 'en' : 'ur')}
                  className="w-full py-1.5 px-3 bg-dark-800 hover:bg-dark-750 border border-dark-700 text-brand-500 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition-colors"
                >
                  <i data-lucide="languages" className="w-3.5 h-3.5"></i>
                  <span>{lang === 'ur' ? 'English View' : 'اردو ڈسپلے'}</span>
                </button>

                <div className="flex items-center justify-between pt-1">
                  <div className="flex items-center gap-2.5 overflow-hidden">
                    <div className="w-8 h-8 rounded-lg bg-brand-500/20 text-brand-500 flex items-center justify-center font-bold text-xs border border-brand-500/40">
                      A
                    </div>
                    <div className="overflow-hidden">
                      <p className="text-xs font-bold text-slate-100 truncate">Abdullah Dilbar</p>
                      <p className="text-[10px] text-slate-400 truncate">Proprietor / Administrator</p>
                    </div>
                  </div>
                </div>
              </div>
            </aside>

            {/* Main Application Container */}
            <div className="flex-1 flex flex-col min-w-0">
              {/* Header Bar */}
              <header className="h-16 bg-dark-900/90 backdrop-blur border-b border-dark-800 px-6 flex items-center justify-between sticky top-0 z-20">
                <div>
                  <h2 className="text-base font-bold text-slate-100 font-display flex items-center gap-2">
                    <span>Muhammad Daal Factory</span>
                    <span className="text-[10px] px-2 py-0.5 rounded bg-brand-500/10 text-brand-500 border border-brand-500/30 font-mono">Faisalabad, PK</span>
                  </h2>
                  <p className="text-xs text-slate-400">Chak 230 RB Chohla, Jhang Road Faisalabad</p>
                </div>

                <div className="flex items-center gap-4">
                  <div className="hidden sm:flex items-center gap-2 px-3 py-1 bg-dark-950 border border-dark-800 rounded-lg text-xs text-slate-300 font-mono">
                    <i data-lucide="calendar" className="w-3.5 h-3.5 text-brand-500"></i>
                    <span>{new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })} • {new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                  </div>

                  <a href="tel:03000676293" className="hidden md:flex items-center gap-2 px-3 py-1 bg-brand-500/10 border border-brand-500/30 text-brand-500 rounded-lg text-xs font-bold">
                    <i data-lucide="phone" className="w-3.5 h-3.5"></i>
                    <span>0300-0676293</span>
                  </a>

                  <div className="flex items-center gap-2 px-3 py-1 bg-dark-800 rounded-lg border border-dark-700 text-xs">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span className="font-bold text-slate-200">Administrator</span>
                  </div>
                </div>
              </header>

              {/* Main Content Area */}
              <main className="flex-1 p-6 overflow-y-auto">
                {/* 1. DASHBOARD TAB */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="flex items-center justify-between">
                      <h1 className="text-3xl font-bold text-slate-100 font-nastaliq">خلاصہ — Executive Overview</h1>
                      <div className="flex items-center gap-3">
                        <button onClick={() => setActiveModal('roznamcha')} className="bg-brand-500 hover:bg-brand-600 text-black text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg shadow-brand-500/20">
                          <i data-lucide="plus" className="w-4 h-4"></i>
                          <span>+ نئ اندراج (Add Entry)</span>
                        </button>
                      </div>
                    </div>

                    {/* Current Cash Balance Roznamcha Header Card */}
                    <div className="bg-gradient-to-r from-brand-900/40 via-dark-900 to-dark-900 border border-brand-500/40 rounded-2xl p-6 glow-card">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-4">
                          <div className="p-4 bg-brand-500/20 text-brand-500 rounded-2xl border border-brand-500/30">
                            <i data-lucide="wallet" className="w-8 h-8"></i>
                          </div>
                          <div>
                            <h2 className="text-2xl font-bold text-brand-500 font-nastaliq">موجودہ روکڑ — Current Cash Balance</h2>
                            <p className="text-xs text-slate-400 mt-0.5">Roznamcha Net Operational Ledger Balance</p>
                          </div>
                        </div>
                        <div className="text-right">
                          <span className="text-4xl font-bold font-display text-brand-500 tracking-tight">PKR {currentRokar.toLocaleString()}</span>
                          <p className="text-xs text-slate-400 mt-1 font-nastaliq">صاف شدہ نقد رقم (Verified Cash Balance)</p>
                        </div>
                      </div>
                    </div>

                    {/* 3 Summary Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-5 glow-card">
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800">
                          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Receivable</span>
                          <span className="text-base font-bold text-sky-400 font-nastaliq">وصولی</span>
                        </div>
                        <div className="mt-4 space-y-2 text-xs">
                          <div className="flex justify-between text-slate-400"><span>Overdue Bills</span><span className="font-bold text-white font-mono">0</span></div>
                          <div className="flex justify-between text-slate-400"><span>Total Overdue</span><span className="font-bold text-white font-mono">PKR 0</span></div>
                          <div className="pt-2 border-t border-dark-800 flex justify-between font-bold text-slate-200">
                            <span>Net Receivable</span>
                            <span className="font-mono text-sky-400">PKR 820,000</span>
                          </div>
                        </div>
                      </div>

                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-5 glow-card">
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800">
                          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Payable</span>
                          <span className="text-base font-bold text-amber-400 font-nastaliq">ادائیگی</span>
                        </div>
                        <div className="mt-4 space-y-2 text-xs">
                          <div className="flex justify-between text-slate-400"><span>Overdue Bills</span><span className="font-bold text-white font-mono">0</span></div>
                          <div className="flex justify-between text-slate-400"><span>Total Overdue</span><span className="font-bold text-white font-mono">PKR 0</span></div>
                          <div className="pt-2 border-t border-dark-800 flex justify-between font-bold text-slate-200">
                            <span>Net Payable</span>
                            <span className="font-mono text-amber-400">PKR 485,000</span>
                          </div>
                        </div>
                      </div>

                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-5 glow-card">
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800">
                          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Stock Balance</span>
                          <span className="text-base font-bold text-emerald-400 font-nastaliq">اسٹاک / مال</span>
                        </div>
                        <div className="mt-4 space-y-2 text-xs">
                          <div className="flex justify-between text-slate-400"><span>Total Purchases In</span><span className="font-bold text-white font-mono">800 Bags</span></div>
                          <div className="flex justify-between text-slate-400"><span>Total Sales Out</span><span className="font-bold text-white font-mono">400 Bags</span></div>
                          <div className="pt-2 border-t border-dark-800 flex justify-between font-bold text-slate-200">
                            <span>Warehouse Stock</span>
                            <span className="font-mono text-emerald-400">{totalStockBags.toLocaleString()} Bags</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Live Machinery Status */}
                    <div className="bg-dark-900 border border-dark-800 rounded-xl p-6">
                      <div className="flex items-center justify-between pb-4 border-b border-dark-800">

                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Type</label>
                          <select value={formRoznamcha.type} onChange={(e) => setFormRoznamcha({ ...formRoznamcha, type: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none">
                            <option value="Cash Received">Cash Received (جمع کیش)</option>
                            <option value="Cash Paid">Cash Paid (بنام کیش)</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Amount (PKR)</label>
                          <input type="number" required value={formRoznamcha.amount} onChange={(e) => setFormRoznamcha({ ...formRoznamcha, amount: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none focus:border-brand-500" placeholder="50000" />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs shadow-lg shadow-brand-500/25">Save Roznamcha Entry</button>
                    </form>
                  )}

                  {/* Worker Modal */}
                  {activeModal === 'worker' && (
                    <form onSubmit={handleAddWorker} className="space-y-4">
                      <h3 className="text-xl font-bold font-nastaliq text-brand-500">نیا کارکن — Add New Worker</h3>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Worker Name (کارکن کا نام)</label>
                        <input type="text" required value={formWorker.name} onChange={(e) => setFormWorker({ ...formWorker, name: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="e.g. Tariq Mehmood" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Role</label>
                          <input type="text" required value={formWorker.role} onChange={(e) => setFormWorker({ ...formWorker, role: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="Mill Operator" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Daily Wage (PKR)</label>
                          <input type="number" required value={formWorker.dailyWage} onChange={(e) => setFormWorker({ ...formWorker, dailyWage: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="2000" />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs">Save Worker Profile</button>
                    </form>
                  )}

                  {/* Purchase Modal */}
                  {activeModal === 'purchase' && (
                    <form onSubmit={handleAddPurchase} className="space-y-4">
                      <h3 className="text-xl font-bold font-nastaliq text-brand-500">نیا اینوائس خرید — New Grain Purchase Order</h3>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Supplier Party</label>
                        <input type="text" required value={formPurchase.supplier} onChange={(e) => setFormPurchase({ ...formPurchase, supplier: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="Sargodha Mills" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Bags Count</label>
                          <input type="number" required value={formPurchase.bags} onChange={(e) => setFormPurchase({ ...formPurchase, bags: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="300" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Rate / Maund (40KG)</label>
                          <input type="number" required value={formPurchase.ratePerMaund} onChange={(e) => setFormPurchase({ ...formPurchase, ratePerMaund: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="6800" />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs">Save Purchase Order</button>
                    </form>
                  )}

                  {/* Sale Modal */}
                  {activeModal === 'sale' && (
                    <form onSubmit={handleAddSale} className="space-y-4">
                      <h3 className="text-xl font-bold font-nastaliq text-brand-500">نیا اینوائس فروخت — Create Sales Invoice</h3>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Customer Party</label>
                        <input type="text" required value={formSale.customer} onChange={(e) => setFormSale({ ...formSale, customer: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="Faisalabad Traders" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Bags Count</label>
                          <input type="number" required value={formSale.bags} onChange={(e) => setFormSale({ ...formSale, bags: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="150" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Rate / Bag (PKR)</label>
                          <input type="number" required value={formSale.rate} onChange={(e) => setFormSale({ ...formSale, rate: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="8200" />
                        </div>
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs">Generate Sales Invoice</button>
                    </form>
                  )}

                  {/* GatePass Modal */}
                  {activeModal === 'gatepass' && (
                    <form onSubmit={handleAddGatePass} className="space-y-4">
                      <h3 className="text-xl font-bold font-nastaliq text-brand-500">نیا گیٹ پاس — Generate Gate Pass</h3>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Vehicle Truck No</label>
                          <input type="text" required value={formGatePass.truckNo} onChange={(e) => setFormGatePass({ ...formGatePass, truckNo: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="FSD-7892" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-400 mb-1">Driver Name</label>
                          <input type="text" required value={formGatePass.driver} onChange={(e) => setFormGatePass({ ...formGatePass, driver: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="Rashid Khan" />
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-400 mb-1">Goods Description & Quantity</label>
                        <input type="text" required value={formGatePass.goods} onChange={(e) => setFormGatePass({ ...formGatePass, goods: e.target.value })} className="w-full bg-dark-950 border border-dark-800 rounded-lg px-3 py-2 text-xs text-slate-100 outline-none" placeholder="250 Bags Daal Chana" />
                      </div>
                      <button type="submit" className="w-full py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs">Issue Official Gate Pass</button>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
