      const initialWorkers = [

      const App = () => {
        const [user, setUser] = useState({ name: 'Administrator', email: 'admin@factoryflow.com', role: 'Admin' });

        const [searchQuery, setSearchQuery] = useState('');

          setTimeout(() => setToastMessage(null), 4000);

          setUser(null);
          setShowAdminMenu(false);
          triggerToast('آپ لاگ آؤٹ ہو گئے۔');

          e.preventDefault();

          e.preventDefault();
          if (formPassword.newPass !== formPassword.confirm) {

            return;
          }

          setFormPassword({ current: '', newPass: '', confirm: '' });

        const totalCashReceived = roznamchaList.filter(r => r.type === 'Cash Received').reduce((acc, r) => acc + r.amount, 0);

                          <button

                            <span>لاگ آؤٹ</span>
                            <i data-lucide="log-out" className="w-4 h-4 text-rose-400"></i>

                        <i data-lucide="plus" className="w-4 h-4"></i>
                        <span>+ نئی اندراج</span>

                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-4">
                          <div className="p-4 bg-brand-500/20 text-brand-500 rounded-2xl border border-brand-500/30">
                            <i data-lucide="wallet" className="w-8 h-8"></i>
                          </div>
                          <div>
                            <h2 className="text-2xl font-bold text-brand-500 font-nastaliq">موجودہ روکڑ</h2>
                            <p className="text-xs text-slate-400 mt-0.5">Current Cash Balance — Roznamcha</p>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-5">
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800">
                          <span className="text-xs font-bold text-slate-300">Receivable</span>
                          <span className="text-sm font-bold text-sky-400 font-nastaliq">وصولی</span>

                        <div className="mt-4 space-y-2 text-xs text-slate-400">

                      <div className="bg-dark-900 border border-dark-800 rounded-xl p-5">
                        <div className="flex items-center justify-between pb-3 border-b border-dark-800">

                  </div>
                )}

                {/* OTHER TABS */}
                {['daybook', 'workers', 'purchase', 'sale', 'parties', 'products', 'stock', 'gatepass', 'reports'].includes(activeTab) && (
                  <div className="space-y-6">
                    <h1 className="text-3xl font-bold text-slate-100 font-nastaliq capitalize">{activeTab} Page</h1>
                    <div className="bg-dark-900 border border-dark-800 rounded-xl p-8 text-center text-slate-400">
                      Module active and operational. Use header actions or entry buttons to test.
                    </div>
                  </div>
                )}
              </main>
            </div>

            {/* MODALS */}
            {activeModal && (
              <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-dark-900 border border-dark-800 rounded-2xl p-6 w-full max-w-md shadow-2xl relative font-sans">
                  <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-slate-400 hover:text-white p-1">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>

                  {/* Change Password Modal (Matching Screenshot 1) */}
                  {activeModal === 'changePassword' && (
                    <form onSubmit={handleChangePassword} className="space-y-4">
                      <div className="flex items-center gap-3 pb-3 border-b border-dark-800">
                        <div className="p-2.5 bg-brand-500/20 text-brand-500 rounded-xl border border-brand-500/30">
                          <i data-lucide="key" className="w-5 h-5"></i>
                        </div>
                        <div>
                          <h3 className="text-xl font-bold text-slate-100 font-nastaliq">پاسورڈ تبدیل کریں</h3>
                          <p className="text-xs text-slate-400 font-mono">Change Password</p>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1.5 font-nastaliq">
                          <span className="text-rose-500">*</span> موجودہ پاسورڈ
                        </label>
                        <input
                          type="password"
                          required
                          value={formPassword.current}
                          onChange={(e) => setFormPassword({ ...formPassword, current: e.target.value })}
                          className="w-full bg-dark-950 border border-dark-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 outline-none focus:border-brand-500"
                          placeholder="••••••••"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1.5 font-nastaliq">
                          <span className="text-rose-500">*</span> نیا پاسورڈ
                        </label>
                        <input
                          type="password"
                          required
                          value={formPassword.newPass}
                          onChange={(e) => setFormPassword({ ...formPassword, newPass: e.target.value })}
                          className="w-full bg-dark-950 border border-dark-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 outline-none focus:border-brand-500 font-nastaliq"
                          placeholder="کم از کم 6 حروف"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-300 mb-1.5 font-nastaliq">
                          <span className="text-rose-500">*</span> پاسورڈ کی تصدیق
                        </label>
                        <input
                          type="password"
                          required
                          value={formPassword.confirm}
                          onChange={(e) => setFormPassword({ ...formPassword, confirm: e.target.value })}
                          className="w-full bg-dark-950 border border-dark-800 rounded-xl px-4 py-2.5 text-xs text-slate-100 outline-none focus:border-brand-500 font-nastaliq"
                          placeholder="نیا پاسورڈ دوبارہ درج کریں"
                        />
                      </div>

                      <div className="flex items-center justify-end gap-3 pt-2">
                        <button
                          type="button"
                          onClick={() => setActiveModal(null)}
                          className="px-5 py-2.5 bg-dark-800 hover:bg-dark-750 text-slate-300 rounded-xl text-xs font-bold font-nastaliq"
                        >
                          منسوخ
                        </button>
                        <button
                          type="submit"
                          className="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-black font-bold rounded-xl text-xs shadow-lg shadow-brand-500/25 font-nastaliq"
                        >
                          محفوظ کریں
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
