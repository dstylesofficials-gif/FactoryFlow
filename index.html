<!DOCTYPE html>

    <title>FactoryFlow Pro - Enterprise Factory Management System</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {

                100: '#e0f2fe',

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <style>

      ::-webkit-scrollbar-thumb:hover { background: #334155; }

        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(12px);

  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, createContext, useContext } = React;

      // Initialize Supabase Client Safely
      const SUPABASE_URL = 'https://demo-factoryflow.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlbW8iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY3MjUxMjAwMCwiZXhwIjoyMDE4MDg4MDAwfQ.demo-key';
      let supabase = null;
      try {
        if (window.supabase) {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        console.warn('Supabase initialization fallback active');

        const colorMap = {
          sky: 'bg-sky-500/10 text-sky-400 border-sky-500/20',
          emerald: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20',
          amber: 'bg-amber-500/10 text-amber-400 border-amber-500/20',
          purple: 'bg-purple-500/10 text-purple-400 border-purple-500/20',
        };

        return (
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition-colors">
            <div className="flex items-center justify-between">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">{title}</span>
              <div className={`p-2.5 rounded-lg border ${colorMap[color] || colorMap.sky}`}>
                <i data-lucide={iconName} className="w-5 h-5"></i>
              </div>
            </div>

            <div className="mt-4">
              <h3 className="text-2xl font-bold text-slate-100 font-display">{value}</h3>
            </div>

            {(subtitle || trend) && (
              <div className="mt-3 flex items-center gap-2 text-xs">
                {trend && (
                  <span className={`inline-flex items-center font-bold px-1.5 py-0.5 rounded ${isPositive ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                    {trend}
                  </span>
                )}
                {subtitle && <span className="text-slate-400">{subtitle}</span>}
              </div>
            )}

        );
      };

        const navItems = [
          { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
          { id: 'factories', label: 'Factories & Plants', icon: 'building-2' },
          { id: 'inventory', label: 'Inventory & Stock', icon: 'boxes' },
          { id: 'production', label: 'Production Work Orders', icon: 'cpu' },
          { id: 'quality', label: 'Quality Control', icon: 'check-circle-2' },
          { id: 'suppliers', label: 'Suppliers & Purchasing', icon: 'truck' },
          { id: 'sales', label: 'Sales Orders', icon: 'shopping-bag' },
          { id: 'workforce', label: 'Workforce & Payroll', icon: 'users' },
          { id: 'reports', label: 'Analytics & Reports', icon: 'bar-chart-3' },
          { id: 'audit', label: 'Audit Logs', icon: 'shield-check' },
          { id: 'settings', label: 'Settings', icon: 'settings' },
        ];

        return (
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col h-screen sticky top-0 z-30">
            <div className="p-5 border-b border-slate-800 flex items-center gap-3">
              <div className="p-2 bg-sky-600 rounded-lg text-white shadow-lg shadow-sky-600/30">
                <i data-lucide="factory" className="w-6 h-6"></i>
              </div>
              <div>
                <h1 className="font-display font-bold text-lg text-slate-100 tracking-tight">FactoryFlow</h1>
                <p className="text-xs text-slate-400 font-medium">Enterprise ERP</p>
              </div>
            </div>

              {navItems.map((item) => {

                return (

                    onClick={() => setActiveTab(item.id)}

              {subtitle && <p className="text-xs text-slate-400">{subtitle}</p>}

                <span>Supabase Cloud Sync</span>
              </div>

                <i data-lucide="search" className="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></i>

                  placeholder="Search work orders, SKUs..."

              <button className="p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg relative transition-colors">
                <i data-lucide="bell" className="w-4 h-4"></i>
                <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-sky-500 rounded-full"></span>
              </button>

        );

      const DashboardView = () => (

          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6">
              <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <i data-lucide="cpu" className="w-5 h-5 text-sky-400"></i>

                    <div className="flex items-center gap-3">
                      <span className={`w-2.5 h-2.5 rounded-full ${m.color === 'emerald' ? 'bg-emerald-400' : m.color === 'amber' ? 'bg-amber-400' : 'bg-sky-400'}`}></span>

                        <p className="text-xs text-slate-400">{m.note}</p>
                      </div>
                    </div>
                    <span className={`text-xs font-semibold px-2.5 py-1 rounded-full border ${m.color === 'emerald' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : m.color === 'amber' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-sky-500/10 text-sky-400 border-sky-500/30'}`}>
                      {m.status}

                  </div>
                ))}
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
              <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <i data-lucide="history" className="w-5 h-5 text-sky-400"></i>
                  <h3 className="font-semibold text-slate-100 font-display">System Audit Logs</h3>
                </div>
                <i data-lucide="shield-check" className="w-4 h-4 text-emerald-400"></i>
              </div>

              <div className="mt-4 space-y-4">
                {[
                  { action: 'Stock Dispatched', detail: '500 Units Aluminium Coils', time: '10 mins ago' },
                  { action: 'Work Order Completed', detail: 'WO-2026-0099 Steel Frames', time: '25 mins ago' },
                  { action: 'Maintenance Logged', detail: 'Oil Filter Change (Press B)', time: '1 hour ago' },
                  { action: 'Quality Inspection', detail: 'Batch #881 Inspection Passed', time: '2 hours ago' },
                ].map((log, i) => (
                  <div key={i} className="flex items-start gap-3 text-xs">
                    <i data-lucide="check-circle-2" className="w-4 h-4 text-sky-400 shrink-0 mt-0.5"></i>
                    <div className="flex-1">
                      <p className="font-semibold text-slate-200">{log.action}</p>
                      <p className="text-slate-400">{log.detail}</p>
                    </div>
                    <span className="text-slate-500 shrink-0">{log.time}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      const FactoriesView = () => (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h3 className="text-xl font-bold font-display text-slate-100">Enterprise Facilities</h3>
              <p className="text-xs text-slate-400">Multi-location factory and plant configuration</p>
            </div>
            <button className="bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition-all">
              <i data-lucide="plus" className="w-4 h-4"></i>
              <span>Add Facility</span>

            ].map((fac, i) => (
              <div key={i} className="bg-slate-900 border border-slate-800 rounded-xl p-5 flex items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <div className="p-3 bg-sky-500/10 text-sky-400 rounded-xl border border-sky-500/20">
                    <i data-lucide="building-2" className="w-6 h-6"></i>
                  </div>
                  <div>
                    <div className="flex items-center gap-3">
                      <h4 className="font-semibold text-slate-100 text-base">{fac.name}</h4>
                      <span className="text-xs font-mono font-medium px-2 py-0.5 bg-slate-800 text-sky-400 rounded border border-slate-700">{fac.code}</span>
                    </div>
                    <div className="flex items-center gap-1.5 text-xs text-slate-400 mt-1">
                      <i data-lucide="map-pin" className="w-3.5 h-3.5"></i>
                      <span>{fac.location}</span>
                    </div>
                  </div>
                </div>

                <div className="flex items-center gap-4">

                  <span className="text-xs font-medium px-3 py-1 bg-purple-500/10 text-purple-400 rounded-lg border border-purple-500/20">{fac.depts}</span>

              </div>
            ))}
          </div>
        </div>
      );

      const InventoryView = () => (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h3 className="text-xl font-bold font-display text-slate-100">Inventory & Warehouse Stock</h3>
              <p className="text-xs text-slate-400">Real-time stock level monitoring across warehouses</p>
            </div>
            <button className="bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition-all">

              <span>Log Stock Movement</span>
            </button>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="border-b border-slate-800 bg-slate-950/50 text-[11px] font-bold text-slate-400 uppercase tracking-wider">

                    { sku: 'FG-GEAR-88', name: 'Industrial Planetary Gearbox V2', cat: 'Finished Good', stock: '140 Units', status: 'Optimal', cost: '$1,450.00' },
                    { sku: 'FG-VALVE-12', name: 'High-Pressure Pneumatic Valve', cat: 'Finished Good', stock: '620 Units', status: 'Optimal', cost: '$185.00' },
                  ].map((item, i) => (
                    <tr key={i} className="hover:bg-slate-800/40 transition-colors">
                      <td className="p-4 font-mono font-bold text-sky-400">{item.sku}</td>
                      <td className="p-4 font-semibold text-slate-200">{item.name}</td>
                      <td className="p-4 text-slate-400">{item.cat}</td>
                      <td className="p-4 font-bold text-slate-100">{item.stock}</td>
                      <td className="p-4 text-slate-300">{item.cost}</td>

      const ProductionView = () => (

            <div>
              <h3 className="text-xl font-bold font-display text-slate-100">Production & Work Orders</h3>
              <p className="text-xs text-slate-400">Track job scheduling, execution status, and plant output</p>

            <button className="bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition-all">
              <i data-lucide="plus" className="w-4 h-4"></i>
              <span>Create Work Order</span>

          <div className="grid grid-cols-1 gap-4">
            {[
              { id: 'WO-2026-0881', product: 'Planetary Gearbox Assembly V2', qty: '500 Units', plant: 'Plant #1 - Machining', status: 'In Progress', progress: 65 },
              { id: 'WO-2026-0882', product: 'Custom Aluminium Enclosure B', qty: '1,200 Units', plant: 'Plant #2 - Fabrication', status: 'Approved', progress: 10 },

                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-sky-500"
                  />
                </div>

                <button type="submit" className="w-full mt-2 bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2.5 px-4 rounded-lg transition-all shadow-lg shadow-sky-600/25">
                  Sign In to System
                </button>
              </form>
            </div>
          </div>
        );
      };

      const App = () => {
        const [user, setUser] = useState({ name: 'Sarah Jenkins', role: 'Super Manager', email: 'admin@factoryflow.com' });
        const [activeTab, setActiveTab] = useState('dashboard');

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        }, [activeTab, user]);

        if (!user) {
          return <LoginView onLogin={(e) => setUser({ name: 'Sarah Jenkins', role: 'Super Manager', email: e })} />;
        }

        const getHeaderInfo = () => {
          switch (activeTab) {
            case 'dashboard': return { title: 'Executive Dashboard', subtitle: 'Real-time overview across operational plants & stock' };
            case 'factories': return { title: 'Factories & Plants', subtitle: 'Multi-facility processing units' };
            case 'inventory': return { title: 'Inventory & Stock', subtitle: 'Raw material and finished goods tracking' };
            case 'production': return { title: 'Production Planning', subtitle: 'Work order scheduling and telemetry' };
            default: return { title: 'FactoryFlow Pro', subtitle: 'Enterprise ERP Portal' };
          }
        };

        const headerInfo = getHeaderInfo();

        return (
          <div className="flex min-h-screen bg-slate-950 text-slate-100">
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} user={user} onLogout={() => setUser(null)} />
            <div className="flex-1 flex flex-col min-w-0">
              <Header title={headerInfo.title} subtitle={headerInfo.subtitle} />
              <main className="flex-1 p-6 overflow-y-auto">
                {activeTab === 'dashboard' && <DashboardView />}
                {activeTab === 'factories' && <FactoriesView />}
                {activeTab === 'inventory' && <InventoryView />}
                {activeTab === 'production' && <ProductionView />}
                {['quality', 'suppliers', 'sales', 'workforce', 'reports', 'audit', 'settings'].includes(activeTab) && <DashboardView />}
              </main>
            </div>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
